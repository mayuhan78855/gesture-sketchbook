<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花开绽放 · Flower Bloom</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='2.2' fill='none' stroke='%23ffb454' stroke-width='1.4'/><path d='M12 9.8 C10 7 10 4.5 12 3 C14 4.5 14 7 12 9.8 M14.2 11 C17.5 9.6 19.8 10.4 20.6 12.8 C18.2 14.2 15.6 13.4 14.2 11 M9.8 11 C6.5 9.6 4.2 10.4 3.4 12.8 C5.8 14.2 8.4 13.4 9.8 11' fill='none' stroke='%232dd8ff' stroke-width='1.3' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="single single-flower">
  <header class="topbar">
    <h1 class="logo"><b>FLOWER</b> BLOOM <span class="logo-sub">花开绽放 · 摄像头人脸背景</span></h1>
    <div id="statusChip" class="chip" data-kind="idle">组件加载中…</div>
  </header>

  <main class="stage">
    <section class="paper-wrap">
      <video id="camBg" class="hidden" autoplay playsinline muted></video>
      <canvas id="space" class="hidden"></canvas>
      <canvas id="galaxy" class="hidden"></canvas>
      <canvas id="paper" width="900" height="560"></canvas>
      <div id="hint" class="hint">AWAITING HAND INPUT<br><span class="cn">捏合手指 · 花朵在指尖绽放</span></div>
      <div id="demoBadge" class="demo-badge hidden">演示模式 · 虚拟手</div>
      <div id="toast" class="toast hidden"></div>
    </section>

    <aside class="side">
      <div class="card view-card">
        <div class="card-title">摄像头取景 <span class="muted">(仅本地处理)</span></div>
        <div class="view-box">
          <div class="nosignal">NO SIGNAL</div>
          <video id="cam" autoplay playsinline muted></video>
        </div>
        <div class="card-tail" id="camStatus">未开启</div>
      </div>

      <div class="card">
        <div class="card-title">手势图例</div>
        <ul class="legend"></ul>
      </div>

      <div class="card">
        <div class="card-title">工具</div>
        <div class="swatches" id="swatches"></div>
        <div class="btn-row">
          <button id="btnClear" class="btn" type="button">清空</button>
          <button id="btnDemo" class="btn ghost" type="button">演示模式</button>
          <button id="btnCam" class="btn ghost" type="button">开启摄像头</button>
        </div>
      </div>
    </aside>
  </main>

  <footer class="foot">
    摄像头画面仅在本机浏览器内分析，不会上传到任何服务器 ·
    <a href="../galaxy/">银河星旅页</a> · <a href="../index.html">完整版（四模式）</a> ·
    <a href="https://github.com/mayuhan78855/gesture-sketchbook" target="_blank" rel="noopener">源码仓库</a>
  </footer>

  <div id="errorPanel" class="error-panel hidden"></div>

  <script>window.__FORCE_MODE = "particles";</script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
