<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花开绽放 · 3D 点云花朵扫描仪</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='2.2' fill='none' stroke='%23ffb454' stroke-width='1.4'/><path d='M12 9.8 C10 7 10 4.5 12 3 C14 4.5 14 7 12 9.8 M14.2 11 C17.5 9.6 19.8 10.4 20.6 12.8 C18.2 14.2 15.6 13.4 14.2 11 M9.8 11 C6.5 9.6 4.2 10.4 3.4 12.8 C5.8 14.2 8.4 13.4 9.8 11' fill='none' stroke='%232dd8ff' stroke-width='1.3' stroke-linecap='round'/></svg>">
  <style>
﻿/* ============================================================
   手势草稿本 · Gesture Sketchbook — NEON HUD
   设计风格：科技感 FUI（Territory Studio 式 HUD）——
   深空底、青色霓虹、扫描线、取景框与等宽仪表读数
   ============================================================ */

:root {
  --bg: #070b12;
  --panel: rgba(13, 20, 32, .88);
  --canvas: #0b111c;
  --ink: #d7e6f5;
  --muted: #6b7f94;
  --line: rgba(45, 216, 255, .28);
  --line-faint: rgba(45, 216, 255, .12);
  --cyan: #2dd8ff;
  --amber: #ffb454;
  --danger: #ff5d6c;
  --ok: #35e08c;
  --tech: "Cascadia Code", Consolas, "Courier New", monospace;
  --ui: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--ui);
  color: var(--ink);
  background:
    radial-gradient(1100px 460px at 50% -12%, rgba(45, 216, 255, .10), transparent 62%),
    radial-gradient(900px 500px at 100% 110%, rgba(123, 108, 255, .07), transparent 60%),
    var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 淡网格 + 扫描线 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(45, 216, 255, .05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45, 216, 255, .05) 1px, transparent 1px);
  background-size: 32px 32px;
  z-index: 0;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 4px);
  z-index: 0;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px 10px;
  border-bottom: 1px solid var(--line-faint);
}

.logo {
  font-family: var(--tech);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: .18em;
  margin: 0;
  text-transform: uppercase;
}
.logo b { color: var(--cyan); font-weight: 600; }
.logo-sub {
  font-size: 11px;
  color: var(--muted);
  margin-left: 12px;
  letter-spacing: .3em;
}

.chip {
  font-family: var(--tech);
  font-size: 12px;
  letter-spacing: .08em;
  padding: 6px 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
}
.chip::before { content: "● "; }
.chip[data-kind="loading"]::before { color: var(--amber); }
.chip[data-kind="ok"]::before { color: var(--ok); }
.chip[data-kind="err"]::before { color: var(--danger); }
.chip[data-kind="demo"]::before { color: var(--cyan); }
.chip[data-kind="idle"]::before { color: var(--muted); }

/* ---------- 主区 ---------- */
.stage {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  gap: 18px;
  padding: 16px 22px 18px;
}

/* ---------- 画布甲板 ---------- */
.paper-wrap {
  position: relative;
  flex: 1;
  min-height: 420px;
  border: 1px solid var(--line);
  background: var(--canvas);
  overflow: hidden;
}
/* 四角 HUD 括号 */
.paper-wrap::before,
.paper-wrap::after {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  border: 2px solid var(--cyan);
  z-index: 2;
  opacity: .85;
}
.paper-wrap::before { left: 8px; top: 8px; border-right: none; border-bottom: none; }
.paper-wrap::after { right: 8px; top: 8px; border-left: none; border-bottom: none; }

#paper { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#space, #galaxy { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#camBg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.media-src { position: fixed; left: -9999px; top: 0; width: 320px; height: 240px; opacity: 0.01; pointer-events: none; }

/* 花朵页 3D 点云扫描仪 HUD */
#darkOverlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.72); }
#flowerStatus {
  position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  font: 600 13px Consolas, "Cascadia Code", monospace; letter-spacing: .18em;
  color: #2dd8ff; background: rgba(7, 11, 18, .6); border: 1px solid rgba(45, 216, 255, .3);
  padding: 8px 18px; white-space: nowrap; z-index: 6;
}
.hud-panel {
  position: absolute; z-index: 6; width: 228px; background: rgba(7, 11, 18, .78);
  border: 1px solid rgba(45, 216, 255, .3); padding: 12px 14px;
  font-family: Consolas, "Cascadia Code", monospace; color: #d7e6f5;
}
.hud-left { left: 16px; top: 50%; transform: translateY(-50%); }
.hud-right { right: 16px; top: 50%; transform: translateY(-50%); }
.hud-title { font-size: 11px; letter-spacing: .16em; color: #2dd8ff; border-bottom: 1px solid rgba(45, 216, 255, .25); padding-bottom: 7px; margin-bottom: 9px; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11.5px; padding: 4px 0; color: #a7b8c9; }
.hud-row input[type="range"] { width: 110px; accent-color: #2dd8ff; }
.hud-row span { color: #6b7f94; text-align: right; }
.hud-btns { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
.hud-btn {
  font: 11px Consolas, monospace; letter-spacing: .1em; color: #d7e6f5; text-align: center;
  background: rgba(45, 216, 255, .08); border: 1px solid rgba(45, 216, 255, .35);
  padding: 7px 10px; cursor: pointer; user-select: none;
}
.hud-btn:hover { color: #2dd8ff; box-shadow: 0 0 12px rgba(45, 216, 255, .25); }
.hud-btn.active { color: #0b111c; background: #2dd8ff; }
.media-src { position: fixed; left: -9999px; top: 0; width: 320px; height: 240px; opacity: 0.01; pointer-events: none; }

/* 独立单体验页（/flower/ /galaxy/）：全屏沉浸，隐藏侧栏与模式切换 */
body.single .mode-row { display: none; }
body.single .topbar { position: fixed; top: 12px; left: 16px; right: 16px; padding: 0; background: transparent; border-bottom: none; z-index: 6; }
body.single .logo { font-size: 15px; letter-spacing: .14em; }
body.single .logo-sub { font-size: 10px; letter-spacing: .18em; }
body.single .chip { font-size: 11px; padding: 4px 10px; background: rgba(7, 11, 18, .6); }
body.single .stage { padding: 0; }
body.single .paper-wrap { position: fixed; inset: 0; border: none; min-height: 100vh; }
body.single .side { display: none; }
body.single .foot { position: fixed; bottom: 10px; left: 0; right: 0; background: transparent; border-top: none; opacity: .55; z-index: 6; }
.gstatus { position: fixed; left: 16px; bottom: 42px; font: 11px Consolas, monospace; letter-spacing: .08em; color: #6b7f94; z-index: 6; }
.float-ctl { position: fixed; right: 16px; bottom: 42px; display: flex; gap: 8px; z-index: 6; }
.float-ctl .btn { flex: none; background: rgba(7, 11, 18, .7); font-size: 11px; padding: 6px 12px; }

/* 3D 空间模式（银河/星环）：纯黑沉浸背景，隐藏纸面网格 */
.paper-wrap.space-bg { background: #000; border-color: rgba(45, 216, 255, .1); }
body.space-mode { background: #020409; }
body.space-mode::before,
body.space-mode::after { display: none; }
#space { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--tech);
  font-size: 17px;
  letter-spacing: .22em;
  color: var(--cyan);
  opacity: .85;
  pointer-events: none;
  line-height: 2.1;
  animation: pulse 2.4s ease-in-out infinite;
}
.hint .cn { color: var(--ink); letter-spacing: .35em; font-size: 14px; }
@keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: .95; } }

.demo-badge {
  position: absolute;
  top: 14px;
  right: 14px;
  font-family: var(--tech);
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--cyan);
  border: 1px dashed var(--cyan);
  background: rgba(7, 11, 18, .8);
  padding: 6px 12px;
  animation: pulse 2s ease-in-out infinite;
}

.toast {
  position: absolute;
  left: 18px;
  bottom: 16px;
  font-family: var(--tech);
  font-size: 13px;
  letter-spacing: .06em;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--cyan);
  padding: 9px 16px;
  animation: pop .18s ease-out;
  box-shadow: 0 0 18px rgba(45, 216, 255, .15);
}
@keyframes pop { from { transform: translateY(6px); opacity: 0; } }

.hidden { display: none !important; }

/* ---------- 侧栏 ---------- */
.side {
  width: 292px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 14px 16px;
  position: relative;
}
.card::before {
  content: "";
  position: absolute;
  left: 0; top: 0;
  width: 34px; height: 2px;
  background: var(--cyan);
  opacity: .8;
}

.card-title {
  font-family: var(--tech);
  font-size: 12.5px;
  letter-spacing: .16em;
  margin-bottom: 10px;
  color: var(--cyan);
  border-bottom: 1px solid var(--line-faint);
  padding-bottom: 7px;
}
.card-title::before { content: "// "; color: var(--muted); }

.muted { font-size: 10.5px; color: var(--muted); letter-spacing: .05em; }

.view-box {
  border: 1px solid var(--line-faint);
  overflow: hidden;
  background: #05080d;
  aspect-ratio: 4 / 3;
  position: relative;
}
.view-box video { opacity: 0; transition: opacity .3s; }
.view-box .nosignal {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--tech);
  font-size: 11px;
  letter-spacing: .3em;
  color: rgba(107, 127, 148, .85);
  background: repeating-linear-gradient(45deg, rgba(45, 216, 255, .03) 0 10px, transparent 10px 20px);
}
.view-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); position: relative; }
.view-box.live video { opacity: 1; }
.view-box.live .nosignal { display: none; }
.view-box::after {
  content: "CAM-01 · LOCAL ONLY";
  position: absolute;
  left: 8px;
  bottom: 6px;
  font-family: var(--tech);
  font-size: 10px;
  letter-spacing: .18em;
  color: var(--cyan);
}
/* 取景框四角 */
.view-box::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px dashed rgba(45, 216, 255, .35);
  pointer-events: none;
  z-index: 1;
}

.card-tail { font-size: 11px; color: var(--muted); margin-top: 8px; font-family: var(--tech); letter-spacing: .05em; }

.legend { list-style: none; margin: 0 0 10px; padding: 0; }
.legend li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  padding: 4.5px 0;
}
.glyph { width: 22px; height: 22px; color: var(--cyan); flex-shrink: 0; filter: drop-shadow(0 0 4px rgba(45, 216, 255, .5)); }

.check {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; cursor: pointer; user-select: none;
}
.check input { accent-color: var(--cyan); width: 14px; height: 14px; }

.swatches { display: flex; gap: 9px; margin-bottom: 12px; flex-wrap: wrap; }
.swatch {
  width: 24px; height: 24px;
  border-radius: 2px;
  border: 1px solid rgba(215, 230, 245, .35);
  cursor: pointer;
  position: relative;
  transition: transform .12s, box-shadow .12s;
}
.swatch:hover { transform: scale(1.12); box-shadow: 0 0 10px rgba(45, 216, 255, .4); }
.swatch.active { outline: 1px solid var(--cyan); outline-offset: 3px; box-shadow: 0 0 12px rgba(45, 216, 255, .5); }

.btn-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }

.btn {
  font-family: var(--tech);
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--ink);
  background: rgba(45, 216, 255, .06);
  border: 1px solid var(--line);
  padding: 8px 14px;
  cursor: pointer;
  flex: 1;
  transition: all .12s;
  text-transform: uppercase;
}
.btn:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  box-shadow: 0 0 14px rgba(45, 216, 255, .25), inset 0 0 10px rgba(45, 216, 255, .08);
}
.btn:active { transform: translateY(1px); }
.btn.ghost { border-style: dashed; color: var(--muted); background: transparent; }
.btn.ghost:hover { color: var(--cyan); }

.foot {
  position: relative;
  z-index: 1;
  font-family: var(--tech);
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--muted);
  text-align: center;
  padding: 10px 0 16px;
  border-top: 1px solid var(--line-faint);
}
.foot a { color: var(--cyan); }

/* ---------- 错误面板 ---------- */
.error-panel {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(3, 6, 10, .72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.error-card {
  background: var(--panel);
  border: 1px solid var(--danger);
  max-width: 480px;
  width: 100%;
  padding: 22px 24px;
  box-shadow: 0 0 40px rgba(255, 93, 108, .18);
}
.error-title {
  font-family: var(--tech);
  font-size: 16px;
  letter-spacing: .1em;
  margin: 0 0 12px;
  color: var(--danger);
}
.error-title::before { content: "⚠ "; }
.error-tips { margin: 0 0 18px; padding-left: 20px; font-size: 13px; line-height: 1.9; color: var(--ink); }
.error-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  .stage { flex-direction: column; }
  .side { width: 100%; flex-direction: row; flex-wrap: wrap; }
  .side .card { flex: 1 1 240px; }
  .paper-wrap { min-height: 52vh; }
}




</style>
</head>
<body class="single single-flower space-mode">
  <main class="stage">
    <section class="paper-wrap">
      <video id="camBg" class="hidden" autoplay playsinline muted></video>
      <div id="darkOverlay"></div>
      <canvas id="space"></canvas>
      <canvas id="galaxy" class="hidden"></canvas>
      <canvas id="paper" class="hidden" width="900" height="560"></canvas>

      <div id="flowerStatus" class="hud-status">AWAITING GESTURE — Open Right Hand to Summon</div>

      <div class="hud-panel hud-left">
        <div class="hud-title">// POINT CLOUD PARAMS</div>
        <label class="hud-row">Min Scale<input id="optMinS" type="range" min="0.4" max="1.2" step="0.05" value="0.6"></label>
        <label class="hud-row">Max Scale<input id="optMaxS" type="range" min="1.0" max="2.2" step="0.05" value="1.6"></label>
        <label class="hud-row">Sensitivity<input id="optSens" type="range" min="0.4" max="2" step="0.1" value="1"></label>
        <label class="hud-row">Move Speed<input id="optMspd" type="range" min="0" max="2" step="0.1" value="1"></label>
        <div class="hud-btns">
          <button id="btnScan" class="hud-btn" type="button">Linear Scan</button>
          <label class="hud-btn" for="plyFile">Upload PLY/XYZ</label>
          <input id="plyFile" type="file" accept=".ply,.xyz,.txt" hidden>
        </div>
      </div>

      <div class="hud-panel hud-right">
        <div class="hud-title">// GESTURE COMMANDS</div>
        <div class="hud-row">Summon<span>Open Palm (Right Hand)</span></div>
        <div class="hud-row">Rotate<span>Twist Right Wrist</span></div>
        <div class="hud-row">Scale<span>Hand Distance</span></div>
        <div class="hud-row">Scan<span>Thumb &amp; Index [Hovering]</span></div>
        <div class="hud-row">Reset<span>Closed Fist (Right Hand)</span></div>
      </div>

      <div id="demoBadge" class="demo-badge hidden">DEMO · 虚拟手</div>
      <div id="toast" class="toast hidden"></div>
    </section>
  </main>

  <footer class="foot">
    摄像头画面仅在本机浏览器内分析，不会上传 ·
    <a href="../galaxy/">银河星旅</a> · <a href="../index.html">完整版</a>
  </footer>

  <div id="errorPanel" class="error-panel hidden"></div>

  <video id="cam" class="media-src" autoplay playsinline muted></video>
  <div id="camStatus" class="media-src"></div>

  <script>
    window.__FORCE_MODE = "flower3d";
  </script>
  <script type="module">
/* ==== js/config.js ==== */
// ============================================================
// config.js -- 全部"可动手改"的参数都集中在这里
// 想改颜色 / 灵敏度 / 笔刷?改完保存,刷新页面即可生效。
// ============================================================

const CONFIG = {
  // 画笔/粒子共用霓虹色板（适配深色画布）：第 1 个是默认色。练手任务：往数组里加一种你喜欢的颜色（任意 #RRGGBB）
  colors: ["#e8f6ff", "#2dd8ff", "#ff5d6c", "#ffb454", "#7b6cff"],

  // 笔刷粗细范围(像素):实际粗细随"手掌大小"自动变化,手掌离镜头越近笔触越粗
  strokeWidth: { min: 2.5, max: 16 },

  // 线条"能量抖动"强度:让霓虹笔迹带一点示波器的不规则感,调成 0 就是平滑直线
  jitter: 1.1,

  // 手部位置平滑系数(0~1):越大越稳、跟手越"黏";调小更灵敏但更抖
  smoothing: 0.55,

  // 手势置信度阈值:识别器给每个手势一个 0~1 的可信度,低于它算"没手势"
  gestureThreshold: 0.6,

  // 防抖帧数:连续 N 帧识别到同一手势才切换,防止手势闪烁造成误触
  stableFrames: 3,

  // "捏合"判定:拇指尖与食指尖的距离 / 手掌大小 < 此值 => 捏合(撤销一笔)
  pinchRatio: 0.045,
  pinchCooldownMs: 900,

  // 单笔最多点数:防止长时间作画时内存无限增长
  maxPointsPerStroke: 600,

  // 最多保留的笔画数:超出后丢弃最旧的
  maxStrokes: 500,

  // ---------- 粒子系统（粒子模式）----------
  particles: {
    max: 4200,             // 同屏最大粒子数（低配电脑调低到 2000）
    streamPerFrame: 6,     // 绘制流：每帧从指尖喷出的粒子数
    fountainPerFrame: 9,   // 离子喷泉：每帧喷射数
    burstCount: 240,       // 能量爆发：一次爆发的粒子数
    novaCount: 420,        // 超新星清空：爆发粒子数
    trailFade: 0.22,       // 拖影长度：越小尾巴越长
    gravity: 90,           // 默认重力（px/s²），个别效果可覆盖
    handDragRadius: 190,   // 掌风半径：手掌挥动带动周围粒子的范围
    handDragStrength: 0.35,// 掌风强度：动作驱动的力度
  },

  // ---------- 3D 星环（Three.js 模式）----------
  space: {
    count: 14000,        // 星环粒子数（低配电脑调低到 6000）
    ringRadius: 2.3,     // 星环基准半径
    thickness: 0.09,     // 星环厚度
    baseSpin: 0.5,       // 基础自旋速度（手掌挥动可加成 3 倍）
  },

  // ---------- 银河星旅（Three.js 模式）----------
  galaxy: {
    stars: 9000,         // 银河背景星数（低配电脑调低到 5000）
    travelDur: 2.2,      // 跃迁飞行时长（秒）
    planetBody: 8000,    // 每颗行星球壳粒子数（低配自动减半；实际按行星半径缩放）
  },

  // MediaPipe 模型/wasm：已本地化在 vendor/ 目录（gestures.js 会优先加载本地，
  // 下面两个 CDN 地址仅作兜底）
  wasmCDN: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm",

// ============================================================
// effects.js —— 「手势 → 粒子效果」注册表（本项目最好玩、最值得改的文件）
//
// 添加一个新手势效果只需要 3 步：
//   1. 在下面的 EFFECTS 里加一个条目，键名用 MediaPipe 的手势名：
//      Open_Palm / Closed_Fist / Pointing_Up / Victory / Thumb_Up /

//        onFrame(hand, ps)  手势持续期间每帧调用（喷射/持续力场写这里）
//        onExit(hand, ps)   手势结束的瞬间触发一次
//   3. 保存并刷新页面——侧栏图例会自动更新，别的文件一行都不用改。
//
// hand 对象（由 app.js 组装）：
//   tip  食指尖像素坐标 {x,y}     palm  掌心像素坐标
//   mid  食指+中指尖中点          dir   食指指向的单位向量 {x,y}
//   vel  掌心移动速度 {x,y} px/s  size  手掌大小（0~1）
//   color 当前画笔颜色             landmarks 21 个关键点
// ps 对象（粒子系统）：
//   spawn({x,y,vx,vy,life,color,size,gravity,drag})
//   burst(x, y, n, {speed,life,size,color})
//   killAll(factor)   attractors / vortices 力场数组   count 当前粒子数
// ============================================================


// 花瓣颜色：花芯金黄，越往外越从品红过渡到蓝紫；加深加饱和，避免人脸背景上发白
function petalColor(t) {
  if (t < 0.16) return "#ffc94d";
  const hue = 335 - (t - 0.16) * 140;
  const light = 42 + t * 26;
  return `hsl(${hue.toFixed(0)}, 95%, ${light.toFixed(0)}%)`;
}

    onEnter(hand, ps) {
      // 花朵页：花心锚定掌心；完整版：锚定食指尖
      const c = window.__FLOWER_ONLY ? hand.palm : hand.tip;
      bloom = { cx: c.x, cy: c.y, rot: Math.random() * Math.PI * 2, grow: 0, seeds: [] };

      const petalLen = [];
      for (let k = 0; k < 6; k++) petalLen.push(0.94 + Math.random() * 0.16);

          // 金色花芯：实心盘，视觉中心
          t = 0.03 + Math.random() * 0.09;
          a = Math.random() * Math.PI * 2;
          r = 3 + Math.random() * 26;
          color = Math.random() < 0.3 ? "#fff3d6" : "#ffcf5c";
          size = 1.6 + Math.random() * 1.5;
        } else {
          // 泪滴形花瓣：瓣根窄、瓣中最宽、瓣尖收拢，瓣间留出明显间隙
          t = 0.14 + Math.pow(Math.random(), 0.8) * 0.86;
          const half = 0.05 + 0.22 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.06)), 0.8);
          a = petal * (Math.PI / 3) + (Math.random() - 0.5) * 2 * half + (Math.random() - 0.5) * 0.012;
          r = 30 + t * 150 * petalLen[petal] * (0.96 + Math.random() * 0.08);
          color = petalColor(t);
          size = 1.3 + Math.random() * 0.9;
        }
        const seed = { a, r, t };
        bloom.seeds.push(seed);
        ps.spawn({
          x: c.x + (Math.random() - 0.5) * 36,
          y: c.y + (Math.random() - 0.5) * 36,
          vx: (Math.random() - 0.5) * 140, vy: (Math.random() - 0.5) * 140,
          life: 6, size,
          color, gravity: 0, drag: 0.9,
          tx: c.x, ty: c.y, stiff: 13 + Math.random() * 9,
          seed,
        });
      }
      ps.burst(c.x, c.y, 120, { color: hand.color, speed: [50, 200], life: [0.8, 1.6] });
    },
    onFrame(hand, ps) {
      if (!bloom) return;
      // 花朵页：花心锚定掌心 + 明显旋转；完整版：跟食指尖 + 缓转
      const anchor = window.__FLOWER_ONLY ? hand.palm : hand.tip;
      const follow = window.__FLOWER_ONLY ? 0.3 : 0.12;
      bloom.cx += (anchor.x - bloom.cx) * follow;
      bloom.cy += (anchor.y - bloom.cy) * follow;
      bloom.grow = Math.min(1, bloom.grow + 0.013);
      bloom.rot += window.__FLOWER_ONLY ? 0.02 : 0.0018;
      for (const p of ps.parts) {
        if (!p.seed) continue;
        const s = p.seed;
        const grow = Math.min(1, (bloom.grow * 1.25 - 0.1) * (1.2 - s.t * 0.25)); // 由内向外开
        const r = s.r * Math.max(0.12, grow);
        p.tx = bloom.cx + Math.cos(s.a + bloom.rot) * r;
        p.ty = bloom.cy + Math.sin(s.a + bloom.rot) * r * 0.94;
        p.life = Math.max(p.life, p.maxLife * 0.7); // 捏着不放就一直活着
      }
    },
    onExit(hand, ps) {
      // 消散：解除弹簧目标，向外轻抛，颜色渐隐
      for (const p of ps.parts) {
        if (!p.seed) continue;
        p.tx = null; p.ty = null;
        const dx = p.x - (bloom ? bloom.cx : p.x);
        const dy = p.y - (bloom ? bloom.cy : p.y);
        const d = Math.hypot(dx, dy) || 1;
        p.vx += (dx / d) * (50 + Math.random() * 170);
        p.vy += (dy / d) * (50 + Math.random() * 170) - 20;
        p.life = Math.min(p.life, 1.0 + Math.random() * 1.0);
      }
      bloom = null;
    },
  },
};

// ============================================================
// sketch.js —— 绘画引擎
// 职责：把手指轨迹变成"霓虹灯管"笔迹，并绘制手部追踪 HUD。
// 结构：strokes 保存已完成的笔画；base 离屏画布缓存已完成的画，
//       每帧只叠加"正在画的这一笔 + HUD 构造线"，保证长时间运行流畅。
// ============================================================


class SketchPad {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.base = document.createElement("canvas");
    this.strokes = [];        // 已完成的笔画 [{pts:[[x,y],...], color, width}]
    this.current = null;      // 正在画的笔画
    this.colorIdx = 0;
    this.widthMode = 0;       // 0 自动 / 1 细 / 2 粗
    this.construction = false;
    this.hand = { present: false };
    this.cursor = null;       // 当前指尖位置(画圆环提示)
    this.dirty = true;
    this.w = 0;
    this.h = 0;
    this._resize();
    window.addEventListener("resize", () => this._resize());
  }

  // ---------- 尺寸 ----------
  _resize() {
    const r = this.canvas.parentElement.getBoundingClientRect();
    if (!r.width || !r.height) return;
    this.w = r.width;
    this.h = r.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [this.canvas, this.base]) {
      c.width = Math.round(this.w * dpr);
      c.height = Math.round(this.h * dpr);
      c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    this._rebuildBase();
  }

  // ---------- 坐标 ----------
  // MediaPipe 关键点是 0~1 归一化坐标,这里映射到画布像素,并做镜像(自拍视角)
  toCanvas(lm) {
    return { x: (1 - lm.x) * this.w, y: lm.y * this.h };
  }

  // ---------- 笔画 ----------
  begin() {
    if (this.current) return;
    this.current = { pts: [], color: CONFIG.colors[this.colorIdx], width: this._width(1) };
  }

  addPoint(x, y, handSize) {
    if (!this.current) return;
    const j = CONFIG.jitter;
    this.current.pts.push([
      x + (Math.random() - 0.5) * 2 * j,
      y + (Math.random() - 0.5) * 2 * j,
    ]);
    if (this.current.pts.length > CONFIG.maxPointsPerStroke) this.current.pts.shift();
    this.current.width = this._width(handSize);
    this.dirty = true;
  }

  end() {
    if (!this.current) return;
    if (this.current.pts.length >= 2) {
      this.strokes.push(this.current);
      if (this.strokes.length > CONFIG.maxStrokes) this.strokes.shift();
    }
    this.current = null;
    this._rebuildBase();
    this.dirty = true;
  }

  _width(handSize) {
    const auto = Math.min(
      CONFIG.strokeWidth.max,
      Math.max(CONFIG.strokeWidth.min, (handSize || 0.25) * 45)
    );
    return auto * [1, 0.55, 1.7][this.widthMode];
  }

  // ---------- 动作 ----------
  setColor(i) {
    this.colorIdx = (i + CONFIG.colors.length) % CONFIG.colors.length;
  }
  cycleColor() {
    this.colorIdx = (this.colorIdx + 1) % CONFIG.colors.length;
  }
  toggleConstruction() {
    this.construction = !this.construction;
    this.dirty = true;
    return this.construction;
  }
  cycleWidth() {
    this.widthMode = (this.widthMode + 1) % 3;
    return ["自动粗细", "细笔", "粗笔"][this.widthMode];
  }
  undo() {
    this.strokes.pop();
    this._rebuildBase();
    this.dirty = true;
  }
  clear() {
    this.strokes = [];
    this.current = null;
    this._rebuildBase();
    this.dirty = true;
  }

  exportPNG() {
    const tmp = document.createElement("canvas");
    tmp.width = this.canvas.width;
    tmp.height = this.canvas.height;
    const ctx = tmp.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(this.base, 0, 0);
    if (this.current && this.current.pts.length) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      ctx.scale(dpr, dpr);
      this._paint(ctx, this.current, 0.9);
    }
    const a = document.createElement("a");
    const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    a.download = `gesture-sketch-${ts}.png`;
    a.href = tmp.toDataURL("image/png");
    a.click();
  }

  // ---------- 渲染 ----------
  _rebuildBase() {
    const bctx = this.base.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bctx.clearRect(0, 0, this.w, this.h);
    for (const s of this.strokes) this._paint(bctx, s, 1);
  }

  render() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);
    ctx.drawImage(this.base, 0, 0, this.w, this.h);
    if (this.current && this.current.pts.length) this._paint(ctx, this.current, 0.55);
    if (this.construction && this.hand.present) this._construction(ctx);
    if (this.cursor) {
      ctx.beginPath();
      ctx.arc(this.cursor.x, this.cursor.y, 7, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(45, 216, 255, .8)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    this.dirty = false;
  }

  // 一笔霓虹线:先画一层宽而淡的能量晕影,再画带辉光的主线,模拟霓虹灯管发光
  _paint(ctx, stroke, opacityScale) {
    const pts = stroke.pts;
    if (pts.length < 2) return;
    const draw = (width, alpha, glow) => {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2;
        const my = (pts[i][1] + pts[i + 1][1]) / 2;
        ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      ctx.strokeStyle = stroke.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (glow) {
        ctx.shadowColor = stroke.color;
        ctx.shadowBlur = Math.min(18, width * 1.6);
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    };
    draw(stroke.width * 2.4, 0.16 * opacityScale, false);
    draw(stroke.width, 0.95 * opacityScale, true);
  }

  // 手部追踪 HUD:圆圈锁定指尖、虚线连接关节、尺寸读数--把识别算法的"视线"画出来
  _construction(ctx) {
    const lm = this.hand.landmarks;
    const P = (i) => this.toCanvas(lm[i]);
    const tips = [4, 8, 12, 16, 20];

    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = "rgba(45, 216, 255, .55)";
    ctx.lineWidth = 1.2;

    // 手腕 -> 四指根 的辅助线(像画人物时的骨架线)
    for (const mcp of [5, 9, 13, 17]) {
      const a = P(0), b = P(mcp);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    // 指尖圆圈
    for (const i of tips) {
      const p = P(i);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.stroke();
    }
    // "量手掌":手腕到中指尖的尺寸线 + 两端的刻度
    const wrist = P(0);
    const midTip = P(12);
    ctx.beginPath();
    ctx.moveTo(wrist.x, wrist.y);
    ctx.lineTo(midTip.x, midTip.y);
    ctx.stroke();
    for (const p of [wrist, midTip]) {
      ctx.beginPath();
      ctx.moveTo(p.x - 4, p.y - 4);
      ctx.lineTo(p.x + 4, p.y + 4);
      ctx.moveTo(p.x + 4, p.y - 4);
      ctx.lineTo(p.x - 4, p.y + 4);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // 手掌尺寸读数
    const mx = (wrist.x + midTip.x) / 2;
    const my = (wrist.y + midTip.y) / 2;
    ctx.font = '11px Consolas, "Cascadia Code", monospace';
    ctx.fillStyle = "rgba(255, 180, 84, .9)";
    ctx.fillText(`SIZE:${Math.round(this.hand.size * 100)}`, mx + 10, my - 4);
    ctx.restore();
  }
}

// ============================================================
// particles.js —— 粒子引擎
// 职责：管理粒子池（生成/受力/消亡）与霓虹辉光渲染（带拖影）。
//       手势→粒子行为的"翻译"不在这里，而在 effects.js 的注册表里。
// 渲染思路：不清屏，而是每帧盖一层半透明深色 => 自然形成发光拖影；
//       粒子用 additive（lighter）混合叠加出霓虹亮度。
// ============================================================


class ParticleSystem {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.trail = document.createElement("canvas"); // 离屏拖影层（不清屏，形成发光尾迹）
    this.parts = [];       // 活跃粒子
    this.attractors = [];  // 引力点 [{x,y,r,strength}]（引力奇点效果使用）
    this.vortices = [];    // 涡流 [{x,y,r,strength}]（量子涡流效果使用）
    this.w = 0;
    this.h = 0;
    this._resize();
    window.addEventListener("resize", () => this._resize());
  }

  get count() {
    return this.parts.length;
  }

  _resize() {
    const r = this.canvas.parentElement.getBoundingClientRect();
    if (!r.width || !r.height) return;
    this.w = r.width;
    this.h = r.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [this.canvas, this.trail]) {
      c.width = Math.round(this.w * dpr);
      c.height = Math.round(this.h * dpr);
      c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  /** 生成一个粒子 */
  spawn(o) {
    if (this.parts.length >= CONFIG.particles.max) this.parts.shift();
    this.parts.push({
      x: o.x, y: o.y,
      vx: o.vx || 0, vy: o.vy || 0,
      life: o.life || 1, maxLife: o.life || 1,
      color: o.color || "#2dd8ff",
      size: o.size || 2,
      gravity: o.gravity ?? CONFIG.particles.gravity,
      drag: o.drag ?? 0.94, // 每帧速度保留比例（帧率归一到 60fps）
      tx: o.tx ?? null, ty: o.ty ?? null, // 弹簧目标点（聚合成形用，如花开绽放）
      stiff: o.stiff || 0,                // 弹簧刚度：越大聚合越快
      seed: o.seed || null,               // 效果自定义数据（如花瓣参数）
    });
  }

  /** 从一点向四周爆发 n 个粒子 */
  burst(x, y, n, opts = {}) {
    const speed = opts.speed || [120, 420];
    const life = opts.life || [0.5, 1.1];
    const size = opts.size || [1.5, 3.5];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed[0] + Math.random() * (speed[1] - speed[0]);
      this.spawn({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life[0] + Math.random() * (life[1] - life[0]),
        color: opts.color || "#2dd8ff",
        size: size[0] + Math.random() * (size[1] - size[0]),
        gravity: 40, drag: 0.85,
      });
    }
  }

  /** 让现有粒子快速消散（factor 越小消散越快，0 = 立即） */
  killAll(factor = 0.2) {
    for (const p of this.parts) p.life = Math.min(p.life, p.maxLife * factor);
  }

  /**
   * 物理更新
   * @param {number} dt 秒
   * @param {{x,y,vx,vy,r,strength}|null} wind 掌风：手掌挥动带动周围粒子
   */
  update(dt, wind) {
    const arr = this.parts;
    for (let i = arr.length - 1; i >= 0; i--) {
      const p = arr[i];
      p.life -= dt;
      if (p.life <= 0) { arr.splice(i, 1); continue; }

      // 引力点：把粒子往里吸
      for (const a of this.attractors) {
        const dx = a.x - p.x, dy = a.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < a.r) {
          const f = a.strength * (1 - d / a.r) * dt;
          p.vx += (dx / d) * f;
          p.vy += (dy / d) * f;
        }
      }
      // 涡流：切向力 + 轻微向心
      for (const v of this.vortices) {
        const dx = p.x - v.x, dy = p.y - v.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < v.r) {
          const k = 1 - d / v.r;
          const f = v.strength * k * dt;
          p.vx += (-dy / d) * f - (dx / d) * f * 0.35;
          p.vy += (dx / d) * f - (dy / d) * f * 0.35;
        }
      }
      // 掌风：手掌速度场带动粒子（这就是"动作"也能驱动粒子的原因）
      if (wind) {
        const dx = p.x - wind.x, dy = p.y - wind.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < wind.r) {
          const k = 1 - d / wind.r;
          p.vx += wind.vx * wind.strength * k * dt * 6;
          p.vy += wind.vy * wind.strength * k * dt * 6;
        }
      }

      // 弹簧追踪：粒子飞向目标点（聚合成形：花开绽放等）
      if (p.tx != null) {
        p.vx += (p.tx - p.x) * p.stiff * dt;
        p.vy += (p.ty - p.y) * p.stiff * dt;
      }

      // 积分
      p.vy += p.gravity * dt;
      const keep = Math.pow(p.drag, dt * 60);
      p.vx *= keep;
      p.vy *= keep;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  /**
   * 渲染：拖影层淡出+叠加粒子 -> 主画布合成 -> 聚合粒子实色绘制 -> HUD
   * 聚合粒子（带 seed）密度高，若进加色拖影层会过曝成白，因此：
   *   主层用正常混合画实色（花形清晰），拖影层只加一点低强度辉光。
   * @param {(ctx: CanvasRenderingContext2D) => void} [hud] 手部 HUD 绘制回调
   */
  render(hud) {
    const tctx = this.trail.getContext("2d");
    // 擦除式拖影：不涂黑而是让拖影层渐隐，这样底层摄像头画面可以透出来
    tctx.globalCompositeOperation = "destination-out";
    tctx.fillStyle = `rgba(0, 0, 0, ${CONFIG.particles.trailFade})`;
    tctx.fillRect(0, 0, this.w, this.h);

    tctx.globalCompositeOperation = "lighter";
    const seeded = [];
    for (const p of this.parts) {
      const t = p.life / p.maxLife;
      const a = Math.min(1, t * 1.6);
      if (p.seed) {
        seeded.push([p, a]);
        // 低强度辉光进拖影层，避免密集粒子互相加成过曝
        tctx.globalAlpha = a * 0.08;
        tctx.fillStyle = p.color;
        tctx.beginPath();
        tctx.arc(p.x, p.y, p.size * 1.8, 0, Math.PI * 2);
        tctx.fill();
      } else {
        tctx.globalAlpha = a;
        tctx.fillStyle = p.color;
        tctx.beginPath();
        tctx.arc(p.x, p.y, Math.max(0.4, p.size * (0.5 + t * 0.5)), 0, Math.PI * 2);
        tctx.fill();
      }
    }
    tctx.globalAlpha = 1;
    tctx.globalCompositeOperation = "source-over";

    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);
    ctx.drawImage(this.trail, 0, 0, this.w, this.h);

    // 聚合粒子：主画布实色，花形清晰可辨；先叠一层低强度加色辉光，做出发光质感
    ctx.globalCompositeOperation = "lighter";
    for (const [p, a] of seeded) {
      ctx.globalAlpha = Math.min(1, a * 0.12);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1.2, p.size * 1.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    for (const [p, a] of seeded) {
      ctx.globalAlpha = Math.min(1, a * 0.95);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.6, p.size * 0.95), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (hud) hud(ctx);
  }
}

// 画笔轨迹（归一化坐标）
function pathPoint(kind, t, seg) {
  if (kind === "star") {
    const R = 0.17;
    const verts = [];
    for (let k = 0; k < 5; k++) {
      const a = ((k * 72 - 90) * Math.PI) / 180;
      verts.push([seg.at.x + R * Math.cos(a), seg.at.y + R * Math.sin(a) * 0.95]);
    }
    const order = [0, 2, 4, 1, 3];
    const idx = Math.min(4, Math.floor(t * 5));
    const a = verts[order[idx]];
    const b = verts[order[(idx + 1) % 5]];
    const f = t * 5 - idx;
    return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f };
  }
  if (kind === "heart") {
    const s = 0.011;
    const a = t * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(a), 3) * s;
    const y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * s;
    return { x: seg.at.x + x, y: seg.at.y + y };
  }
  if (kind === "wave") {
    const x = -0.22 + t * 0.5;
    const y = 0.52 + 0.1 * Math.sin(t * Math.PI * 2);
    return { x: x + 0.24, y };
  }
  return { x: seg.at.x, y: seg.at.y };
}

const POSE_NAME = { Open_Palm: "open", Closed_Fist: "fist", Pointing_Up: "point", Victory: "victory", Thumb_Up: "thumb", Thumb_Index: "pinch", None: "open" };

// 生成 21 个关键点：模板 + 缩放 + 位置 + 轻微呼吸抖动
function buildHand(x, y, gesture, t) {
  const pose = POSES[POSE_NAME[gesture] || "open"];
  const s = 0.34;
  const lm = [];
  for (let i = 0; i < 21; i++) {
    const [px, py] = pose[i];
    lm.push({
      x: x + px * s + Math.sin(t * 7 + i * 1.7) * 0.0035,
      y: y + py * s + Math.cos(t * 6 + i * 1.3) * 0.0035,
    });
  }
  return lm;
}

class DemoHand {
  constructor(cb) {
    this.cb = cb; // { onFrame, onGesture }
    this.t = 0;
    this._prev = 0;
    this._timer = 0;
    this._lastG = null;
    this._running = false;
  }

  start() {
    if (this._running) return;
    this._running = true;
    this._prev = performance.now();
    // 用 rAF 驱动时间轴：与显示器垂直同步、后台标签自动暂停（省 CPU）
    const loop = () => {
      if (!this._running) return;
      this._tick();
      this._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  stop() {
    this._running = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  _tick() {
    const now = performance.now();
    const dt = Math.min(0.1, (now - this._prev) / 1000);
    this._prev = now;
    if (this.hold) return; // 3D 引擎就绪前暂停时间轴，保证与渲染同步
    this.t += dt;

    // 时间轴走完一圈后从头循环（末尾的“点赞”会清空画布，循环不会堆积）
    if (this.t >= SEGMENTS[SEGMENTS.length - 1].t1) {
      this.t = 0;
      this._lastG = null;
    }

    const seg = SEGMENTS.find((s) => this.t >= s.t0 && this.t < s.t1) || SEGMENTS[SEGMENTS.length - 1];

    // 手势变化时触发一次性事件（换色/构造线/清空等）
    if (seg.gesture !== this._lastG) {
      this._lastG = seg.gesture;
      if (seg.gesture !== "None" && this.cb.onGesture) this.cb.onGesture(seg.gesture, 1);
    }

    let landmarks = null;
    if (seg.gesture !== "None") {
      const p = seg.path ? pathPoint(seg.path, (this.t - seg.t0) / (seg.t1 - seg.t0), seg) : seg.at;
      landmarks = buildHand(p.x, p.y, seg.gesture, this.t);
    }

    this.cb.onFrame({
      landmarks,
      gesture: seg.gesture,
      confidence: 1,
      size: 0.30,
      latencyMs: 1,
      demo: true,
    });
  }
}

// ============================================================
// space3d.js —— 3D 星环模式（Three.js）
// 一条土星式星环（上万粒子）绕行星 core 旋转，手势/动作实时驱动：
//   张开手掌  视角随手掌移动；挥动越快环转越快（角动量）
//   握拳      星环收缩 + 自旋加速（像吸积），松开弹回
//   捏合      万千粒子聚合成星球（弹簧→目标点），松开还原星环
//   食指上指  切俯瞰视角看环全貌
//   剪刀手    星环分裂成内外双环
//   点赞      超新星：向外爆开再自动归位
// Three.js 按需懒加载（断网时其他模式不受影响）。
// ============================================================


// Three.js 加载：本地 vendor 优先（随仓库部署，离线可用），CDN 兑底
async function loadTHREE() {
  let lastErr;
  for (const src of ["../vendor/three.module.js", "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "https://unpkg.com/three@0.160.0/build/three.module.js"]) {
    try { return await import(src); } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

class Space3D {
  constructor(canvas) {
    this.canvas = canvas;
    this.ready = false;
    this.count = 0;
    this.morph = "ring";      // ring | sphere | collapse | split
    this.azim = 0.6; this.polar = 1.05;
    this.azimT = 0.6; this.polarT = 1.05;
    this.spinBoost = 0;
    this._g = "None";
    this._time = 0;
  }

  async init() {
    if (this.ready) return; // 防重入
    const THREE = await loadTHREE();
    const S = CONFIG.space;
    // 低配降档
    const LOWEND = (navigator.hardwareConcurrency || 4) <= 4;
    if (LOWEND) S.count = Math.round(S.count * 0.5);

    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, alpha: true, antialias: true });
    this.renderer.setClearColor(0x000000, 0);
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);

    // ---- 星环粒子 ----
    const N = S.count;
    this.count = N;
    this.a = new Float32Array(N);       // 环上角度
    this.rr = new Float32Array(N);      // 归一化半径 (0..1)
    this.yy = new Float32Array(N);      // 环厚度偏移
    this.sp = new Float32Array(N);      // 个体速度因子（内快外慢，像开普勒）
    this.rm = new Float32Array(N);      // 当前半径倍率（分裂/收缩用）
    this.rmT = new Float32Array(N);     // 半径倍率目标
    this.sph = new Float32Array(N * 3); // 球形聚合目标（捏合用）
    this.nv = new Float32Array(N * 3);  // 超新星冲量
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);

    const cIn = new THREE.Color("#ffb85c"), cMid = new THREE.Color("#cfdcff"), cOut = new THREE.Color("#7cd4ff");
    const fib = 2.399963;
    for (let i = 0; i < N; i++) {
      this.a[i] = Math.random() * Math.PI * 2;
      this.rr[i] = Math.random();
      this.yy[i] = (Math.random() - 0.5) * 2 * S.thickness * (1 - this.rr[i] * 0.5);
      this.sp[i] = 0.6 + (1 - this.rr[i]) * 1.1 + Math.random() * 0.25;
      this.rm[i] = 1; this.rmT[i] = 1;
      // 球形聚合目标（斐波那契球，均匀铺满）
      const y = 1 - (2 * (i + 0.5)) / N;
      const rad = Math.sqrt(Math.max(0, 1 - y * y));
      this.sph[i * 3] = Math.cos(fib * i) * rad * 1.06;
      this.sph[i * 3 + 1] = y * 1.06;
      this.sph[i * 3 + 2] = Math.sin(fib * i) * rad * 1.06;
      // 颜色：内圈暖金 → 中段米白 → 外圈冰蓝
      const t = this.rr[i];
      const c = cIn.clone().lerp(cMid, clamp(t * 1.6, 0, 1)).lerp(cOut, clamp((t - 0.55) * 2.2, 0, 1));
      const v = 0.85 + Math.random() * 0.15;
      col[i * 3] = c.r * v; col[i * 3 + 1] = c.g * v; col[i * 3 + 2] = c.b * v;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    this.pos = pos;
    this.geo = geo;
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 0.042, vertexColors: true, transparent: true, opacity: 0.88,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    this.scene.add(this.points);

    // ---- 行星 core + 大气辉光 ----
    this.core = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 32, 24),
      new THREE.MeshBasicMaterial({ color: 0x0f1a2a })
    );
    this.glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.62, 32, 24),
      new THREE.MeshBasicMaterial({ color: 0x1d6fb8, transparent: true, opacity: 0.16, side: THREE.BackSide })
    );
    this.scene.add(this.core, this.glow);

    this._resize();
    this.ready = true;
  }

  /** 释放全部 GPU 资源 */
  dispose() {
    this.ready = false;
    this.scene.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    });
    if (this.renderer) this.renderer.dispose();
  }

  _resize() {
    const r = this.canvas.parentElement.getBoundingClientRect();
    if (!r.width || !r.height || !this.renderer) return;
    this.renderer.setSize(r.width, r.height, false);
    this.camera.aspect = r.width / r.height;
    this.camera.updateProjectionMatrix();
    this.vw = r.width;
    this.vh = r.height;
  }

  /** 每帧更新：dt 秒，hand 为手部上下文（可 null），gesture 为当前手势名 */
  update(dt, hand, gesture) {
    if (!this.ready) return;
    const S = CONFIG.space;
    this._time += dt;

    // ---- 手势切换 ----
    if (gesture !== this._g) {
      if (this._g === "Thumb_Index" && this.morph === "sphere") this.morph = "ring";
      if (this._g === "Closed_Fist" && this.morph === "collapse") this.morph = "ring";
      if (this._g === "Victory" && this.morph === "split") this.morph = "ring";
      if (gesture === "Thumb_Index") this.morph = "sphere";
      if (gesture === "Closed_Fist") this.morph = "collapse";
      if (gesture === "Victory") this.morph = "split";
      if (gesture === "Thumb_Up") this._nova();
      this._g = gesture;
    }

    // ---- 相机与自旋：手掌位置/速度驱动 ----
    if (hand && this.vw) {
      const nx = hand.palm.x / this.vw, ny = hand.palm.y / this.vh;
      this.azimT = (nx - 0.5) * 2.6;
      this.polarT = gesture === "Pointing_Up" ? 0.16 : clamp(0.35 + ny * 1.05, 0.12, 1.5);
      const speed = Math.hypot(hand.vel.x, hand.vel.y);
      this.spinBoost += (Math.min(3.2, speed / 380) - this.spinBoost) * Math.min(1, dt * 3);
    }
    this.azim += (this.azimT - this.azim) * Math.min(1, dt * 3);
    this.polar += (this.polarT - this.polar) * Math.min(1, dt * 3);
    this.spinBoost *= Math.pow(0.5, dt); // 松手后缓慢回落

    const spin = (S.baseSpin * (1 + this.spinBoost)) * dt;
    const collapseK = this.morph === "collapse" ? 0.42 : 1;
    this.rmScale = this.rmScale === undefined ? 1 : this.rmScale;
    const rmScaleT = this.morph === "collapse" ? 0.42 : 1;
    this.rmScale += (rmScaleT - this.rmScale) * Math.min(1, dt * 4);

    const pos = this.pos;
    const k = this.morph === "sphere" ? Math.min(1, dt * 5.5) : Math.min(1, dt * 9);
    for (let i = 0; i < this.count; i++) {
      this.a[i] += spin * this.sp[i];
      // 半径倍率目标（分裂：内外双环）
      const rmT = this.morph === "split" ? (i % 2 ? 1.38 : 0.72) : 1;
      this.rm[i] += (rmT * this.rmScale - this.rm[i]) * Math.min(1, dt * 3.5);

      let tx, ty, tz;
      if (this.morph === "sphere") {
        tx = this.sph[i * 3]; ty = this.sph[i * 3 + 1]; tz = this.sph[i * 3 + 2];
      } else {
        const R = S.ringRadius * this.rr[i] ** 0.5 * 0.72 + 0.55; // 内密外疏
        tx = Math.cos(this.a[i]) * R * this.rm[i];
        tz = Math.sin(this.a[i]) * R * this.rm[i];
        ty = this.yy[i] * this.rmScale;
      }
      const i3 = i * 3;
      // 超新星冲量
      pos[i3] += this.nv[i3] * dt;
      pos[i3 + 1] += this.nv[i3 + 1] * dt;
      pos[i3 + 2] += this.nv[i3 + 2] * dt;
      const nk = Math.pow(0.12, dt);
      this.nv[i3] *= nk; this.nv[i3 + 1] *= nk; this.nv[i3 + 2] *= nk;
      // 弹簧式回归目标
      pos[i3] += (tx - pos[i3]) * k;
      pos[i3 + 1] += (ty - pos[i3 + 1]) * k;
      pos[i3 + 2] += (tz - pos[i3 + 2]) * k;
    }
    this.geo.attributes.position.needsUpdate = true;

    // ---- 相机 ----
    const R = 5.7;
    this.camera.position.set(
      Math.sin(this.azim) * Math.sin(this.polar) * R,
      Math.cos(this.polar) * R,
      Math.cos(this.azim) * Math.sin(this.polar) * R
    );
    this.camera.lookAt(0, 0, 0);
    this.points.rotation.x = 0.42 + Math.sin(this._time * 0.3) * 0.08; // 土星式倾角
    this.points.rotation.z = 0.24;
    // 捏合成星球时 core 稍微发亮
    const coreS = this.morph === "sphere" ? 1.12 : 1;
    this.core.scale.setScalar(coreS);
    this.glow.material.opacity = this.morph === "sphere" ? 0.28 : 0.16;
  }

  /** 超新星：全体粒子向外爆开（目标点不变，随后自动归位） */
  _nova() {
    const pos = this.pos;
    for (let i = 0; i < this.count; i++) {
      const i3 = i * 3;
      let x = pos[i3], y = pos[i3 + 1], z = pos[i3 + 2];
      const d = Math.hypot(x, y, z) || 1;
      const s = 2.2 + Math.random() * 3.4;
      this.nv[i3] = (x / d) * s;
      this.nv[i3 + 1] = (y / d) * s;
      this.nv[i3 + 2] = (z / d) * s;
    }
  }

  render() {
    if (!this.ready) return;
    this.renderer.render(this.scene, this.camera);
  }
}

// ============================================================
// galaxy.js —— 银河星旅模式（Three.js）
// 螺旋星系粒子背景 + 七大行星悬浮其中，手部实时选择与跃迁：
//   张开手掌  银河全景视角随手掌轻微游移；光标（掌心）悬停哪颗行星，哪颗高亮
//   捏合      跃迁到选中的行星（穿越飞行），到达后环绕行星特写；再捏合返回全景
//   点赞      直接返回银河全景
//   握拳      银河旋转加速
//   剪刀手    时间迟缓（星流减速）
//   食指上指  拉高视角俯瞰银河旋臂
// Seven planets = 太阳系除地球外的七大行星。
// ============================================================


const PLANETS = [
  // 半径按真实比例，以木星 r=0.92 为基准（真实比：水 0.035 / 金 0.087 / 火 0.048 / 木 1.0 / 土 0.833 / 天 0.363 / 海 0.352）
