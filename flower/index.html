  { name: "土星", en: "SATURN",  color: 0xe8cf96, r: 0.766, dist: 14.4, y: 0.6,  blurb: "戴环的巨人", ring: "bright" },
  { name: "天王星", en: "URANUS", color: 0x7fd4d9, r: 0.334, dist: 16.0, y: -1.6, blurb: "躺着自转的冰巨星", ring: "faint" },
  { name: "海王星", en: "NEPTUNE", color: 0x4f7fe0, r: 0.324, dist: 17.6, y: 1.1,  blurb: "风暴与深蓝", ring: "faint" },
];

/**
 * makeParticlePlanet —— 粒子行星工厂
 * 球壳：斐波那契球均匀布点（顶点色按纬度渐变）+ 暗色 core 撑体积；
 * 光环：复用 space3d 的环采样数学（rr 内密外疏 / yy 厚度 / sp 内快外慢），倾角固定；
 * 环粒子位置每帧由 update() 推进（到达态由手驱动加速）。
 */
function makeParticlePlanet(p, THREE, LOWEND, bodyNBase) {
  const group = new THREE.Group();
  const base = new THREE.Color(p.color);
  const bright = base.clone().lerp(new THREE.Color("#ffffff"), 0.4);
  const dark = base.clone().lerp(new THREE.Color("#000000"), 0.3);

  // ---- 球壳 ----
  const bodyN = LOWEND ? Math.round(bodyNBase * 0.5) : Math.round(bodyNBase * (0.5 + p.r * 0.7));
  const bodyGeo = new THREE.BufferGeometry();
  const bpos = new Float32Array(bodyN * 3);
  const bcol = new Float32Array(bodyN * 3);
  for (let i = 0; i < bodyN; i++) {
    const y = 1 - (2 * (i + 0.5)) / bodyN;
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const phi = i * 2.399963;
    // 纬度色带（气巨星条纹感）：在极→赤道渐变上叠加按纬度的明暗条带
    const band = 0.5 + 0.5 * Math.sin(y * 13 + (Math.random() - 0.5) * 0.7);
    const grad = clampGalaxy((y + 1) / 2 + (Math.random() - 0.5) * 0.2, 0, 1);
    const c = dark.clone().lerp(bright, grad * (0.68 + 0.32 * band));
    bpos[i * 3] = Math.cos(phi) * rad * p.r;
    bpos[i * 3 + 1] = y * p.r;
    bpos[i * 3 + 2] = Math.sin(phi) * rad * p.r;
    bcol[i * 3] = Math.min(1, c.r); bcol[i * 3 + 1] = Math.min(1, c.g); bcol[i * 3 + 2] = Math.min(1, c.b);
  }
  bodyGeo.setAttribute("position", new THREE.BufferAttribute(bpos, 3));
  bodyGeo.setAttribute("color", new THREE.BufferAttribute(bcol, 3));
  const pointsBody = new THREE.Points(bodyGeo, new THREE.PointsMaterial({
    size: Math.max(0.025, p.r * 0.05), vertexColors: true, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  }));
  group.add(pointsBody);

  // （已移除实心 core mesh —— 用户要求纯粒子行星，不要实心填充）

  // ---- 光环（土星亮环；木星/天王星/海王星淡环）----
  let pointsRing = null, ringGeo = null;
  let a = null, rr = null, yy = null, sp = null, rm = null, ringN = 0, ringR0 = null;
  if (p.ring) {
    const isBright = p.ring === "bright";
    ringN = isBright ? (LOWEND ? 1200 : 2500) : (LOWEND ? 600 : 1200);
    a = new Float32Array(ringN); rr = new Float32Array(ringN); yy = new Float32Array(ringN);
    sp = new Float32Array(ringN); rm = new Float32Array(ringN); ringR0 = new Float32Array(ringN);
    ringGeo = new THREE.BufferGeometry();
    const rpos = new Float32Array(ringN * 3);
    const rcol = new Float32Array(ringN * 3);
    const rIn = p.r * 1.4, rOut = p.r * (isBright ? 2.4 : 2.0);
    const rc = base.clone().lerp(new THREE.Color("#ffffff"), 0.3);
    for (let i = 0; i < ringN; i++) {
      rr[i] = Math.pow(Math.random(), 0.6); // 内密外疏
      a[i] = Math.random() * Math.PI * 2;
      yy[i] = (Math.random() - 0.5) * (0.05 + rr[i] * 0.05) * p.r * 2;
      sp[i] = 1.15 - rr[i]; // 内快外慢
      rm[i] = 1;
      ringR0[i] = rIn + rr[i] * (rOut - rIn);
      rpos[i * 3] = Math.cos(a[i]) * ringR0[i];
      rpos[i * 3 + 1] = yy[i];
      rpos[i * 3 + 2] = Math.sin(a[i]) * ringR0[i];
      const c = rc.clone().lerp(new THREE.Color("#ffffff"), Math.random() * 0.25);
      rcol[i * 3] = c.r; rcol[i * 3 + 1] = c.g; rcol[i * 3 + 2] = c.b;
    }
    ringGeo.setAttribute("position", new THREE.BufferAttribute(rpos, 3));
    ringGeo.setAttribute("color", new THREE.BufferAttribute(rcol, 3));
    pointsRing = new THREE.Points(ringGeo, new THREE.PointsMaterial({
      size: Math.max(0.035, p.r * 0.055), vertexColors: true, transparent: true,
      opacity: isBright ? 0.85 : 0.4, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    pointsRing.rotation.x = Math.PI / 2.35;
    group.add(pointsRing);
  }
  return { group, pointsBody, pointsRing, bodyGeo, ringGeo, a, rr, yy, sp, rm, ringN, ringR0 };
}

// Three.js 加载：本地 vendor 优先（随仓库部署，离线可用），CDN 兑底
async function loadTHREEGalaxy() {
  let lastErr;
  for (const src of ["../vendor/three.module.js", "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "https://unpkg.com/three@0.160.0/build/three.module.js"]) {
    try { return await import(src); } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

const clampGalaxy = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (t) => t * t * (3 - 2 * t);

class Galaxy3D {
  constructor(canvas) {
    this.canvas = canvas;
    this.ready = false;
    this.count = 0;
    this.state = "overview";   // overview | travel | arrived
    this.selected = null;      // 选中的行星（离光标最近）
    this.labels = [];          // 投影到屏幕的行星标记（给 2D HUD 画）
    this._g = "None";
    this._ang = 0;
    this._time = 0;
  }

  async init() {
    if (this.ready) return; // 防重入
    const THREE = await loadTHREEGalaxy();
    const G = CONFIG.galaxy;
    this.THREE = THREE; // 供 init 之外的方法使用（Vector3 等）
    // 低配降档：星场/太阳粒子数减半
    const LOWEND = (navigator.hardwareConcurrency || 4) <= 4;
    const starsN = LOWEND ? Math.round(G.stars * 0.5) : G.stars;
    const sunN = LOWEND ? Math.round(4000 * 0.5) : 4000;
    this.THREE = THREE;

    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, alpha: true, antialias: true });
    this.renderer.setClearColor(0x000000, 0);
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(58, 1, 0.1, 300);
    this.lookTarget = new THREE.Vector3(0, 0, 0);
    this._zero = new THREE.Vector3(0, 0, 0);

    // 灯光：让行星有明暗立体感
    this.scene.add(new THREE.AmbientLight(0x8899bb, 0.55));
    const sun = new THREE.DirectionalLight(0xfff2d9, 1.35);
    sun.position.set(-6, 9, 4);
    this.scene.add(sun);

    // ---- 银河系粒子背景：3 条旋臂 + 中心核球 + 零散晕星 ----
    const N = starsN;
    this.count = N;
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    const cCore = new THREE.Color("#ffd9a0"), cArmA = new THREE.Color("#cfe2ff"), cArmB = new THREE.Color("#ffb4c8"), cHalo = new THREE.Color("#8fa3c8");
    const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
    for (let i = 0; i < N; i++) {
      let x, y, z, c;
      if (i < N * 0.09) {
        // 中心核球：暖色密集
        const r = Math.pow(Math.random(), 1.6) * 5.5 + 0.4;
        const a = Math.random() * Math.PI * 2;
        x = Math.cos(a) * r; z = Math.sin(a) * r * 0.72; y = gauss() * 1.1;
        c = cCore;
      } else if (i < N * 0.88) {
        // 旋臂：对数螺旋 + 横向散布
        const arm = i % 3;
        const r = 4 + Math.pow(Math.random(), 0.6) * 52;
        const spread = 0.16 + 6 / (r + 4);
        const a = arm * (Math.PI * 2 / 3) + Math.log(r + 1) * 1.9 + gauss() * spread;
        x = Math.cos(a) * r + gauss() * 1.4;
        z = Math.sin(a) * r + gauss() * 1.4;
        y = gauss() * 1.3 * (1 - r / 70);
        c = Math.random() < 0.78 ? cArmA : cArmB;
      } else {
        // 晕星：大范围稀疏
        const r = 20 + Math.random() * 60;
        const a = Math.random() * Math.PI * 2;
        const b = (Math.random() - 0.5) * Math.PI;
        x = Math.cos(a) * Math.cos(b) * r; z = Math.sin(a) * Math.cos(b) * r; y = Math.sin(b) * r * 0.6;
        c = cHalo;
      }
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      const v = 0.7 + Math.random() * 0.3;
      col[i * 3] = c.r * v; col[i * 3 + 1] = c.g * v; col[i * 3 + 2] = c.b * v;
    }
    const sgeo = new THREE.BufferGeometry();
    sgeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    sgeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    this.galaxyPoints = new THREE.Points(sgeo, new THREE.PointsMaterial({
      size: 0.09, vertexColors: true, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    this.scene.add(this.galaxyPoints);

    // ---- 太阳：发光恒星（大尺寸 + 白热核心 + 柔和日冕）----
    const SN = LOWEND ? 10000 : 20000;
    const sunPos = new Float32Array(SN * 3);
    const sunCol = new Float32Array(SN * 3);
    const cHot = new THREE.Color("#fff7d6"), cMid = new THREE.Color("#ffd35c"), cEdge = new THREE.Color("#ff8a2c");
    for (let i = 0; i < SN; i++) {
      // 中心极密、向外渐疏；整体半径放大到 ~2.0（仍远小于水星 6.5 轨道）
      const rr = Math.pow(Math.random(), 2.7) * 2.0;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      sunPos[i * 3] = rr * Math.sin(ph) * Math.cos(th);
      sunPos[i * 3 + 1] = rr * Math.cos(ph);
      sunPos[i * 3 + 2] = rr * Math.sin(ph) * Math.sin(th);
      const t = clampGalaxy(rr / 2.0, 0, 1);
      const c = cHot.clone().lerp(cMid, t * 0.7).lerp(cEdge, clampGalaxy((rr - 1.2) / 0.8, 0, 1));
      sunCol[i * 3] = c.r; sunCol[i * 3 + 1] = c.g; sunCol[i * 3 + 2] = c.b;
    }
    const sunGeo = new THREE.BufferGeometry();
    sunGeo.setAttribute("position", new THREE.BufferAttribute(sunPos, 3));
    sunGeo.setAttribute("color", new THREE.BufferAttribute(sunCol, 3));
    this.sun = new THREE.Points(sunGeo, new THREE.PointsMaterial({
      size: 0.05, vertexColors: true, transparent: true, opacity: 1.0,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    this.scene.add(this.sun);

    // ---- 日冕：更大更稀的橙色光晕，营造发光感 ----
    const CN = LOWEND ? 4500 : 9000;
    const coronaPos = new Float32Array(CN * 3);
    const coronaCol = new Float32Array(CN * 3);
    const cCor = new THREE.Color("#ffb060");
    for (let i = 0; i < CN; i++) {
      const rr = 1.9 + Math.pow(Math.random(), 0.55) * 2.4;   // 1.9..4.3 外壳
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      coronaPos[i * 3] = rr * Math.sin(ph) * Math.cos(th);
      coronaPos[i * 3 + 1] = rr * Math.cos(ph) * 0.85;
      coronaPos[i * 3 + 2] = rr * Math.sin(ph) * Math.sin(th);
      const c = cCor.clone().multiplyScalar(0.85);
      coronaCol[i * 3] = c.r; coronaCol[i * 3 + 1] = c.g; coronaCol[i * 3 + 2] = c.b;
    }
    const coronaGeo = new THREE.BufferGeometry();
    coronaGeo.setAttribute("position", new THREE.BufferAttribute(coronaPos, 3));
    coronaGeo.setAttribute("color", new THREE.BufferAttribute(coronaCol, 3));
    this.corona = new THREE.Points(coronaGeo, new THREE.PointsMaterial({
      size: 0.15, vertexColors: true, transparent: true, opacity: 0.2,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    this.scene.add(this.corona);

    // ---- 行星轨道线：淡淡的圆环，让“行星绕太阳”一眼可读 ----
    for (const p of PLANETS) {
      const orbit = new THREE.Mesh(
        new THREE.RingGeometry(p.dist - 0.03, p.dist + 0.03, 96),
        new THREE.MeshBasicMaterial({ color: 0x2dd8ff, transparent: true, opacity: 0.1, side: THREE.DoubleSide })
      );
      orbit.rotation.x = Math.PI / 2;
      orbit.position.y = p.y;
      this.scene.add(orbit);
    }

    // ---- 太阳 + 七大行星（太阳已为点云，行星由 makeParticlePlanet 生成）----
    this.planets = PLANETS.map((p, i) => {
      if (p.isSun) {
        // 太阳已在 init() 中作为 this.sun / this.corona 单独创建，这里仅占位供标签使用
        return { ...p, pos: new THREE.Vector3(0, 0, 0) };
      }
      const ang = i * 2.399963 + 0.7;
      const made = makeParticlePlanet(p, THREE, LOWEND, CONFIG.galaxy.planetBody);
      const group = made.group;
      made.azim = 0; made.polar = 0.5; made.azimT = 0; made.polarT = 0.5; made.spinBoost = 0;
      const px = Math.cos(ang) * p.dist, pz = Math.sin(ang) * p.dist, py = p.y;
      group.position.set(px, py, pz);
      this.scene.add(group);
      return { ...p, ...made, pos: new THREE.Vector3(px, py, pz) };
    });
    });

    this._resize();
    this.camera.position.set(0, 7.5, 14.5);
    this.camera.lookAt(0, 0, 0);
    this.ready = true;
  }

  /** 释放全部 GPU 资源（切模式/重初始化前调用） */
  dispose() {
    this.ready = false;
    this.scene.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    });
    if (this.renderer) this.renderer.dispose();
  }

  _resize() {
    const r = this.canvas.parentElement.getBoundingClientRect();
    if (!r.width || !r.height || !this.renderer) return;
    this.renderer.setSize(r.width, r.height, false);
    this.camera.aspect = r.width / r.height;
    this.camera.updateProjectionMatrix();
    this.vw = r.width;
    this.vh = r.height;
  }

  /** 跃迁到某颗行星 */
  _travelTo(planet) {
    this.state = "travel";
    this._arrivedPlanet = planet;
    this._from = this.camera.position.clone();
    this._fromLook = this.lookTarget.clone();
    const dir = this.camera.position.clone().sub(planet.pos).normalize();
    this._to = planet.pos.clone().add(dir.multiplyScalar(planet.r * 3.6)).add(new this.THREE.Vector3(0, planet.r * 1.1, 0));
    this._toLook = planet.pos.clone();
    this._travelP = 0;
    this._orbitAng = Math.random() * Math.PI * 2;
  }

  /** 返回银河全景 */
  _returnOverview() {
    this.state = "travel";
    this._arrivedPlanet = null;
    this._from = this.camera.position.clone();
    this._fromLook = this.lookTarget.clone();
    this._to = new this.THREE.Vector3(0, 7.5, 14.5);
    this._toLook = new this.THREE.Vector3(0, 0, 0);
    this._travelP = 0;
  }

  update(dt, hand, gesture) {
    if (!this.ready) return;
    const G = CONFIG.galaxy;
    this._time += dt;

    // ---- 手势切换 ----
    if (gesture !== this._g) {
      if (gesture === "Thumb_Index") {
        if (this.state === "overview") {
          const sel = this.planets.find((p) => p.name === this.selected) || this.planets[3];
          this._travelTo(sel);
        } else if (this.state === "arrived") {
          this._returnOverview();
        }
      }
      if (gesture === "Thumb_Up" && this.state !== "overview" && this.state !== "travel") this._returnOverview();
      this._g = gesture;
    }

    // ---- 银河旋转：握拳加速 / 剪刀手迟缓 ----
    const spinMul = gesture === "Closed_Fist" ? 6 : gesture === "Victory" ? 0.15 : 1;
    this.galaxyPoints.rotation.y += dt * 0.008 * spinMul;

    // ---- 状态机 ----
    if (this.state === "travel") {
      this._travelP = Math.min(1, this._travelP + dt / G.travelDur);
      const e = smooth(this._travelP);
      this.camera.position.lerpVectors(this._from, this._to, e);
      this.lookTarget.lerpVectors(this._fromLook, this._toLook, e);
      this.camera.lookAt(this.lookTarget);
      if (this._travelP >= 1) {
        this.state = this._arrivedPlanet ? "arrived" : "overview";
      }
    } else if (this.state === "arrived") {
      // 到达后：环绕行星缓慢特写
      const p = this._arrivedPlanet;
      this._orbitAng += dt * 0.14;
      const d = Math.max(0.45, p.r * 2.9); // 小行星（水星等）按真实比例后极小，限制最近距离避免相机穿入
      this.camera.position.set(
        p.pos.x + Math.cos(this._orbitAng) * d,
        p.pos.y + p.r * 1.15,
        p.pos.z + Math.sin(this._orbitAng) * d
      );
      this.lookTarget.copy(p.pos);
      this.camera.lookAt(p.pos);
    } else {
      // 全景：视角随手掌游移；食指上指拉高俯瞰
      let azim = this._ang, height = 7.5, radius = 14.5;
      if (hand && this.vw) {
        const nx = hand.palm.x / this.vw;
        azim += (nx - 0.5) * 1.1;
        if (gesture === "Pointing_Up") { height = 13.5; radius = 9.5; }
        else height = 6.8 + (1 - hand.palm.y / this.vh) * 2.4;
      }
      this._ang += dt * 0.02;
      this.camera.position.set(Math.sin(azim) * radius, height, Math.cos(azim) * radius);
      this.lookTarget.lerp(this._zero, Math.min(1, dt * 3));
      this.camera.lookAt(this.lookTarget);
    }

    // ---- 行星联动：到达态由手驱动（方位/俯仰/环自旋加速）；全景缓慢自转、选中可抓取 ----
    const arrivedP = this._arrivedPlanet;
    for (const pl of this.planets) {
      if (this.state === "arrived" && arrivedP && pl.name === arrivedP.name) {
        if (hand && this.vw) {
          const nx = clampGalaxy(hand.palm.x / this.vw, 0, 1);
          const ny = clampGalaxy(hand.palm.y / this.vh, 0, 1);
          pl.azimT = (nx - 0.5) * 2.4;
          pl.polarT = 0.25 + ny * 0.95;
          const speed = Math.hypot(hand.vel.x, hand.vel.y);
          pl.spinBoost += (Math.min(3.2, speed / 380) - pl.spinBoost) * Math.min(1, dt * 3);
        } else {
          pl.spinBoost *= Math.pow(0.5, dt);
        }
        pl.azim += (pl.azimT - pl.azim) * Math.min(1, dt * 3);
        pl.polar += (pl.polarT - pl.polar) * Math.min(1, dt * 3);
        pl.group.rotation.y = pl.azim;
        pl.group.rotation.x = pl.polar * 0.55;
        // 环粒子自旋（内快外慢 + 手速加成）
        if (pl.pointsRing && pl.ringN) {
          const spin = dt * (0.5 + pl.spinBoost * 1.7);
          const attr = pl.pointsRing.geometry.attributes.position;
          const arr = attr.array;
          for (let i = 0; i < pl.ringN; i++) {
            pl.a[i] += spin * pl.sp[i];
            const R0 = pl.ringR0[i];
            arr[i * 3] = Math.cos(pl.a[i]) * R0;
            arr[i * 3 + 2] = Math.sin(pl.a[i]) * R0;
            arr[i * 3 + 1] = pl.yy[i];
          }
          attr.needsUpdate = true;
        }
      } else {
        // 全景：缓慢自转；选中的行星稍快并轻微摆动（可被抓取的反馈）
        const isSel = this.selected === pl.name;
        pl.group.rotation.y += dt * (isSel ? 0.35 : 0.05);
        if (isSel && hand) pl.group.rotation.z = Math.sin(this._time * 1.2) * 0.06;
        else pl.group.rotation.z *= Math.pow(0.5, dt);
      }
    }

    // ---- 太阳自转 + 日冕 + 轻微脉动（更亮更有生命感）----
    this.sun.rotation.y += dt * 0.1;
    this.corona.rotation.y += dt * 0.05;
    this.sun.material.size = 0.05 + Math.sin(this._time * 1.6) * 0.009;
    this.corona.material.opacity = 0.2 + Math.sin(this._time * 1.2) * 0.05;

    // ---- 行星标签投影（2D HUD 用）----
    this.labels = this.planets.map((p) => {
      const v = p.pos.clone().project(this.camera);
      return {
        name: p.name, en: p.en, blurb: p.blurb,
        x: (v.x * 0.5 + 0.5) * this.vw,
        y: (-v.y * 0.5 + 0.5) * this.vh,
        visible: v.z < 1 && this.state === "overview",
      };
    });
    // 光标（掌心）最近的可控行星 = 选中
    if (hand && this.vw && this.state === "overview") {
      let best = null, bs = 1e9;
      for (const l of this.labels) {
        if (!l.visible) continue;
        if (l.name === "太阳") continue; // 太阳不参与光标选中（始终显示，但不作为可抵达目标）
        // 驻留偏置：当前选中的行星额外减 55px 距离，防止光标抖动导致标签闪烁
        const d = Math.hypot(l.x - hand.palm.x, l.y - hand.palm.y) - (l.name === this.selected ? 55 : 0);
        if (d < bs) { bs = d; best = l; }
      }
      if (best) { best.selected = true; this.selected = best.name; }
    }
  }

  render() {
    if (!this.ready) return;
    this.renderer.render(this.scene, this.camera);
  }
}


/* ==== js/flower3d.js ==== */
// ============================================================
// flower3d.js —— 3D 点云花朵扫描仪（flower 独立页专用）
// Three.js 点云花（花瓣/茎/叶）+ 几何扫描笼 + 扫描平面横扫；
// 手势驱动：张手召唤/手腕转=旋转/手远近=缩放/捏合悬停=扫描/握拳重置。
// 单 rAF 循环；LOWEND 自动减半；dispose() 释放全部 GPU 资源。
// ============================================================

async function loadTHREEFlower() {
  let lastErr = null;
  for (const src of ["../vendor/three.module.js", "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"]) {
    try { return await import(src); } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("three 加载失败");
}

const clampF = (v, a, b) => Math.min(b, Math.max(a, v));
const smoothF = (t) => t * t * (3 - 2 * t);

class Flower3D {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.opts = opts; // 由 app.js 传入的共享对象（滑杆实时改这里）
    if (this.opts.scaleMin === undefined) this.opts.scaleMin = 0.6;
    if (this.opts.scaleMax === undefined) this.opts.scaleMax = 1.6;
    if (this.opts.sensitivity === undefined) this.opts.sensitivity = 1;
    if (this.opts.moveSpeed === undefined) this.opts.moveSpeed = 1;
    if (this.opts.forceScan === undefined) this.opts.forceScan = false;
    this.ready = false;
    this.state = "idle";
    this.stateText = "AWAITING GESTURE — Open Right Hand to Summon";
    this.count = 0;
    this.fade = 0;          // 点云整体淡入 0..1
    this.reveal = 0;        // 逐层显现进度 0..1
    this.cage = 0.25;       // 扫描笼展开 0.25..1
    this.rotY = 0;          // 花的朝向（手腕控制）
    this.scale = 1;
    this.scanT = 0;         // 扫描平面相位
    this.scanning = false;
    this._g = "None";
    this._time = 0;
    this.pos = { x: 0, y: 0 };
  }

  async init() {
    if (this.ready) return;
    const THREE = await loadTHREEFlower();
    this.THREE = THREE;
    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, alpha: true, antialias: true });
    this.renderer.setClearColor(0x000000, 0);
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(50, 1, 0.1, 60);
    this.camera.position.set(0, 0.35, 4.1);
    this.camera.lookAt(0, 0, 0);
    this.scene.add(new THREE.AmbientLight(0x99aacc, 0.7));
    const dl = new THREE.DirectionalLight(0xffffff, 0.9);
    dl.position.set(2, 4, 3);
    this.scene.add(dl);

    // ---- 点云花：牡丹式多层花瓣 / 花芯 / 花茎 / 叶 ----
    const LOW = (navigator.hardwareConcurrency || 4) <= 4;
    const perOuter = LOW ? 300 : 600;   // 外层花瓣粒子
    const perMid   = LOW ? 270 : 540;   // 中层花瓣粒子
    const perInner = LOW ? 225 : 450;   // 内层花瓣粒子
    const total = LOW ? Math.round(11000 / 2) : 11000;
    const group = new THREE.Group();
    const pts = [];
    const cols = [];
    const reveal = [];                  // 逐层显现顺序（0=最先，1=最后）
    const push = (x, y, z, r, g, b, rev) => { pts.push(x, y, z); cols.push(r, g, b); reveal.push(rev); };

    // 花瓣：牡丹式 3 层宽圆花瓣（外层平展浅粉 → 中层仰起红粉 → 内层直立深红）
    const layers = [
      { count: 12, per: perOuter, open: 0.22, len: 2.15, width: 0.48,
        hue: 355, sat0: 16, sat1: 28, lig0: 80, lig1: 68, rev: 0.42 }, // 外层：浅粉白
      { count: 10, per: perMid,   open: 0.42, len: 1.68, width: 0.42,
        hue: 356, sat0: 38, sat1: 52, lig0: 68, lig1: 56, rev: 0.28 }, // 中层：红粉
      { count: 8,  per: perInner, open: 0.62, len: 1.20, width: 0.34,
        hue: 357, sat0: 55, sat1: 70, lig0: 56, lig1: 44, rev: 0.14 }, // 内层：深红
    ];
    for (const L of layers) {
      const CO = Math.cos(L.open), SO = Math.sin(L.open);
      for (let k = 0; k < L.count; k++) {
        const baseA = k * ((Math.PI * 2) / L.count) + (L.count === 10 ? 0.31 : 0.12);
        const ca = Math.cos(baseA), sa = Math.sin(baseA);
        // 花瓣局部坐标系：e1=仰起的径向，e2=水平切向（宽度方向）
        const e1x = ca * CO, e1y = SO, e1z = sa * CO;
        const e2x = -sa, e2y = 0, e2z = ca;
        for (let i = 0; i < L.per; i++) {
          const u = Math.pow(Math.random(), 0.55);               // 沿花瓣 0..1（根部偏密）
          // 宽圆牡丹瓣：早期即宽、圆头、不尖
          const half = L.width * Math.pow(Math.sin(Math.PI * Math.min(1, u)), 0.55) * (0.55 + 0.45 * Math.sin(Math.PI * u * 0.5));
          const w = (Math.random() * 2 - 1) * half;              // 横向 -1..1
          const l = 0.1 + u * L.len;                              // 花瓣长度
          let x = e1x * l;
          let y = e1y * l;
          let z = e1z * l;
          x += e2x * w;
          z += e2z * w;
          // 杯状：边缘上卷(+Y)并略外扩，尖端微收
          const cupY = w * w * 0.45;
          const cupOut = w * w * 0.10;
          y += cupY - u * u * 0.15;
          x += ca * cupOut;
          z += sa * cupOut;
          // 更自然的粒子分布：根部更密集，尖端更稀疏，增加真实感
          const density = Math.pow(u, 0.3); // 根部密度高，尖端密度低
          const nz = (Math.random() - 0.5) * 0.03 * density;
          x += nz; y += nz; z += nz;
          // 花瓣边缘的自然变化：增加细微的不规则性
          const edgeVariation = Math.sin(u * Math.PI * 4) * 0.005 * (1 - u);
          x += edgeVariation;
          z += edgeVariation * 0.5;
          // 颜色：由该层基色向深色过渡
          const t = u;
          const hue = L.hue - t * 5;
          const sat = L.sat0 + t * (L.sat1 - L.sat0);
          const lig = L.lig0 - t * (L.lig0 - L.lig1) - Math.abs(w) * 8 - (Math.random() - 0.5) * 4;
          const c = new THREE.Color(`hsl(${hue.toFixed(0)}, ${sat.toFixed(0)}%, ${clampF(lig, 36, 92).toFixed(0)}%)`);
          const rev = L.rev + t * 0.32 + Math.random() * 0.05;
          push(x, y, z, c.r, c.g, c.b, clampF(rev, 0, 1));
        }
      }
    }
    // 花芯：金黄雄蕊密簇
    for (let i = 0; i < (LOW ? 400 : 800); i++) {
      const r = Math.pow(Math.random(), 0.5) * 0.18;
      const a = Math.random() * Math.PI * 2;
      const c = new THREE.Color(Math.random() < 0.45 ? "#fff0a3" : "#ffcc33");
      push(Math.cos(a) * r, Math.sin(a) * r * 0.6 + 0.04, 0.04 + Math.random() * 0.08, c.r, c.g, c.b, Math.random() * 0.08);
    }
    // 花茎：沿曲线采样的点（绿）
    const stemN = LOW ? 450 : 900;
    for (let i = 0; i < stemN; i++) {
      const t = i / stemN;
      const x = 0.22 * Math.sin(t * 2.4) + (Math.random() - 0.5) * 0.03;
      const y = -0.25 - t * 1.75;
      const z = 0.12 * Math.sin(t * 3.1) + (Math.random() - 0.5) * 0.03;
      const c = new THREE.Color(`hsl(${(78 + Math.random() * 22).toFixed(0)}, 46%, ${(26 + t * 20).toFixed(0)}%)`);
      push(x, y, z, c.r, c.g, c.b, 0.7 + t * 0.3);
    }
    // 叶：叶柄连接花茎 + 叶片从叶柄末端向外伸展（叶脉结构 + 自然边缘）
    for (const [tt, side] of [[0.42, 1], [0.68, -1]]) {
      const n = LOW ? 200 : 400;
      // 花茎上叶柄的附着点（与茎生成公式完全一致，保证贴合）
      const ax = 0.22 * Math.sin(tt * 2.4);
      const ay = -0.25 - tt * 1.75;
      const az = 0.12 * Math.sin(tt * 3.1);
      // 叶柄：从茎点斜向外下方连到叶片基部
      const petN = LOW ? 30 : 60;
      const pox = 0.26 * side, poz = 0.07 * side, poy = -0.07; // 叶柄末端相对茎点的偏移
      for (let i = 0; i < petN; i++) {
        const t = i / petN;
        const droop = t * t * 0.025;                       // 叶柄略下垂
        const j = (Math.random() - 0.5) * 0.012;
        const c = new THREE.Color(`hsl(${(80 + Math.random() * 15).toFixed(0)}, 48%, ${(26 + t * 8).toFixed(0)}%)`);
        push(ax + pox * t + j, ay + poy * t - droop + j, az + poz * t + j, c.r, c.g, c.b, 0.72 + t * 0.08);
      }
      // 叶片：基部在叶柄末端，沿外向展开的半椭圆叶形
      const bx = ax + pox, by = ay + poy - 0.028, bz = az + poz;
      const leafLength = 0.55, leafWidth = 0.17;
      for (let i = 0; i < n; i++) {
        const s = Math.pow(Math.random(), 0.7);            // 沿叶长 0..1（基部偏密）
        const half = leafWidth * Math.pow(Math.sin(Math.PI * Math.min(1, 0.12 + s * 0.94)), 0.6); // 宽度剖面：基部窄-中部宽-尖收
        const w = (Math.random() * 2 - 1) * half;
        // 叶身：沿外向展开，叶尖下垂 + 横向微卷
        let lx = bx + side * s * leafLength;
        let ly = by - s * s * 0.10 + w * w * 0.35;
        let lz = bz + w * (1 + 0.15 * s);
        // 中脉贴近判断（w 越接近 0 越靠近中脉）
        const midProx = Math.max(0, 1 - Math.abs(w) / (half * 0.35 + 1e-6));
        // 侧脉：从中脉斜出的波纹
        lz += Math.sin(s * Math.PI * 6) * 0.005 * side * (w >= 0 ? 1 : -1);
        // 边缘自然变化
        lx += (Math.random() - 0.5) * 0.012;
        ly += (Math.random() - 0.5) * 0.012;
        // 颜色：中脉更亮更绿，叶缘更深
        const hue = 84 + Math.random() * 20;
        const sat = 46 + midProx * 12;
        const lig = clampF(30 + midProx * 10 + Math.random() * 8 - s * 4, 20, 46);
        const c = new THREE.Color(`hsl(${hue.toFixed(0)}, ${sat.toFixed(0)}%, ${lig.toFixed(0)}%)`);
        const rev = 0.72 + s * 0.22 + Math.random() * 0.04;
        push(lx, ly, lz, c.r, c.g, c.b, clampF(rev, 0, 1));
      }
    }

    const geo = new THREE.BufferGeometry();
    this.baseCol = new Float32Array(cols);
    this.revealArr = new Float32Array(reveal);
    this.count = pts.length / 3;
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts), 3));
    geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(cols), 3));
    this.flowerGeo = geo;
    this.flowerMat = new THREE.PointsMaterial({
      size: 0.022, vertexColors: true, transparent: true, opacity: 0.88,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
      // 增强粒子效果：根据深度和重要性调整大小
      sizeAttenuation: true,
      // 添加轻微的发光效果
      depthTest: true,
    });
    this.flower = new THREE.Points(geo, this.flowerMat);
    group.add(this.flower);
    this.flowerGroup = group;
    this.scene.add(group);

    // ---- 几何扫描笼：八面体线框 + 方形底环，包住牡丹大花 ----
    const cage = new THREE.Group();
    const oct = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.OctahedronGeometry(1.8, 0)),
      new THREE.LineBasicMaterial({ color: 0x2dd8ff, transparent: true, opacity: 0.22 })
    );
    cage.add(oct);
    const box = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(2.0, 2.0, 2.0)),
      new THREE.LineBasicMaterial({ color: 0x2dd8ff, transparent: true, opacity: 0.13 })
    );
    cage.add(box);
    this.cageGroup = cage;
    this.scene.add(cage);

    // ---- 扫描平面：半透明青色矩形，沿 Z 往复横扫 ----
    this.scanPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(2.2, 2.2),
      new THREE.MeshBasicMaterial({ color: 0x2dd8ff, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false })
    );
    this.scene.add(this.scanPlane);

    this._resize();
    this.ready = true;
  }

  _resize() {
    const r = this.canvas.parentElement.getBoundingClientRect();
    if (!r.width || !r.height || !this.renderer) return;
    this.renderer.setSize(r.width, r.height, false);
    this.camera.aspect = r.width / r.height;
    this.camera.updateProjectionMatrix();
    this.vw = r.width; this.vh = r.height;
  }

  /** 点云显隐：reveal 控制逐层显现；扫描平面附近临时提亮 */
  _applyColors(scanning) {
    const col = this.flowerGeo.attributes.color.array;
    const pos = this.flowerGeo.attributes.position.array;
    const planeZ = this.scanPlane.position.z;
    for (let i = 0; i < this.count; i++) {
      const rev = this.revealArr[i];
      let f = this.reveal >= rev ? 1 : 0.06;
      let boost = 1;
      if (scanning) {
        const dz = Math.abs(pos[i * 3 + 2] - planeZ);
        boost = 1 + 2.4 * Math.max(0, 1 - dz / 0.3);
      }
      col[i * 3] = this.baseCol[i * 3] * f * boost;
      col[i * 3 + 1] = this.baseCol[i * 3 + 1] * f * boost;
      col[i * 3 + 2] = this.baseCol[i * 3 + 2] * f * boost;
    }
    this.flowerGeo.attributes.color.needsUpdate = true;
  }

  update(dt, hand, gesture) {
    if (!this.ready) return;
    this._time += dt;
    const S = this.opts;

    // ---- 手势状态机 ----
    if (gesture !== this._g) {
      if (gesture === "Open_Palm" && (this.state === "idle" || this.state === "resetting")) {
        this.state = "summoning"; this.reveal = Math.max(this.reveal, 0.02); this.cage = 0.25;
      }
      if (gesture === "Closed_Fist" && this.state !== "idle") {
        this.state = "resetting"; this.scanning = false;
      }
      this._g = gesture;
    }
    this.scanning = (gesture === "Thumb_Index" || this.opts.forceScan) && (this.state === "active" || this.state === "summoning");

    // ---- 手驱动：旋转 / 缩放 / 平移 ----
    if (hand && this.vw) {
      const lm = hand.landmarks;
      if (lm) {
        const dx = lm[9].x - lm[0].x, dy = lm[9].y - lm[0].y;
        const roll = Math.atan2(dx, -dy) * S.sensitivity; // 手腕方向 → 花的朝向
        this.rotY += (roll - this.rotY) * Math.min(1, dt * 2.6);
      }
      const sT = S.scaleMin + clampF((hand.size - 0.12) / 0.3, 0, 1) * (S.scaleMax - S.scaleMin);
      this.scale += (sT - this.scale) * Math.min(1, dt * 3.5);
      this.pos.x += ((hand.palm.x / this.vw - 0.5) * 1.5 * S.moveSpeed - this.pos.x) * Math.min(1, dt * 2.5);
      this.pos.y += (-(hand.palm.y / this.vh - 0.5) * 0.9 * S.moveSpeed - this.pos.y) * Math.min(1, dt * 2.5);
    }

    // ---- 状态推进 ----
    if (this.state === "summoning") {
      this.reveal = Math.min(1, this.reveal + dt * 0.85);
      this.fade = Math.min(1, this.fade + dt * 1.4);
      this.cage = 0.25 + smoothF(Math.min(1, this.fade)) * 0.75;
      if (this.reveal >= 1 && this.fade >= 1) { this.state = "active"; this.stateText = "ACTIVE"; }
      else this.stateText = "SUMMONING";
    } else if (this.state === "resetting") {
      this.reveal = Math.max(0, this.reveal - dt * 1.6);
      this.fade = Math.max(0, this.fade - dt * 1.8);
      this.cage = 0.25 + this.fade * 0.75;
      if (this.fade <= 0.01) { this.state = "idle"; this.stateText = "AWAITING GESTURE — Open Right Hand to Summon"; }
      else this.stateText = "RESETTING";
    } else if (this.state === "active") {
      this.stateText = this.scanning ? "SCANNING" : "ACTIVE";
    }

    // ---- 应用变换 ----
    this.flowerGroup.rotation.y = this.rotY + Math.sin(this._time * 0.5) * 0.06;
    this.flowerGroup.rotation.x = -0.15 + Math.sin(this._time * 0.4) * 0.04; // 轻微前倾，让向上的立体碗正对镜头
    this.flowerGroup.position.set(this.pos.x, this.pos.y + 0.12, 0);
    const sc = this.scale * (0.55 + 0.45 * this.fade);
    this.flowerGroup.scale.setScalar(sc);
    this.cageGroup.position.set(this.pos.x, this.pos.y, 0);
    this.cageGroup.scale.setScalar(this.cage * this.scale * 0.95);
    this.cageGroup.rotation.y += dt * 0.35;
    this.cageGroup.rotation.x = Math.sin(this._time * 0.4) * 0.15;
    this.scanPlane.position.z = Math.sin(this.scanT) * 1.8;
    this.scanPlane.rotation.z += dt * 0.6;
    this.scanPlane.visible = this.scanning || this.state === "summoning";
    if (this.scanning) this.scanT += dt * 3.2;
    this._applyColors(this.scanning);
  }

  render() {
    if (!this.ready) return;
    this.renderer.render(this.scene, this.camera);
  }

  dispose() {
    this.ready = false;
    this.scene.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    });
    if (this.renderer) this.renderer.dispose();
  }

  /** 上传点云（XYZ：x y z [r g b]，或 PLY ascii）：替换花点云并居中归一化 */
  loadPointCloud(text) {
    const THREE = this.THREE;
    const pos = [], col = [];
    const lines = text.split(/\r?\n/);
    let isPly = false, header = false, vCount = 0, read = 0;
    for (const raw of lines) {
      const s = raw.trim();
      if (!s) continue;
      if (/^ply/i.test(s)) { isPly = true; continue; }
      if (isPly && /^format ascii/i.test(s)) { header = true; continue; }
      if (isPly && /^element vertex (\d+)/i.test(s)) { vCount = parseInt(RegExp.$1); continue; }
      if (isPly && /^end_header/i.test(s)) { header = true; continue; }
      if (isPly && !header) continue;
      const f = s.split(/\s+/).map(Number);
      if (f.length >= 3 && f.every((v) => !isNaN(v))) {
        pos.push(f[0], f[1], f[2]);
        if (f.length >= 6) col.push(f[3] / 255, f[4] / 255, f[5] / 255);
        else col.push(0.8, 0.85, 1);
        read++;
        if (isPly && vCount && read >= vCount) break;
      }
    }
    if (!pos.length) return false;
    // 居中 + 归一化到 ~2.2
    let cx = 0, cy = 0, cz = 0;
    const n = pos.length / 3;
    for (let i = 0; i < n; i++) { cx += pos[i * 3]; cy += pos[i * 3 + 1]; cz += pos[i * 3 + 2]; }
    cx /= n; cy /= n; cz /= n;
    let maxR = 0.001;
    for (let i = 0; i < n; i++) {
      pos[i * 3] -= cx; pos[i * 3 + 1] -= cy; pos[i * 3 + 2] -= cz;
      maxR = Math.max(maxR, Math.hypot(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]));
    }
    const s = 2.2 / maxR;
    for (let i = 0; i < n * 3; i++) pos[i] *= s;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
    geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(col), 3));
    this.flowerGeo.dispose();
    this.flowerGeo = geo;
    this.flower.geometry = geo;
    this.baseCol = new Float32Array(col);
    this.revealArr = new Float32Array(n); // 上传点云直接全显现
    this.reveal = 1;
    this.fade = 1;
    if (this.state === "idle") { this.state = "active"; this.stateText = "ACTIVE"; }
    this.count = n;
    return true;
  }
}

// ============================================================
// gestures.js —— 手势识别引擎
// 职责：打开摄像头 -> 跑 MediaPipe GestureRecognizer -> 输出
//       { landmarks: 21个手部关键点, gesture: 手势名, ... }
// 所有识别都在浏览器本地完成，视频帧不会离开这台电脑。
// ============================================================


// MediaPipe 识别库不在这里静态导入——改为开摄像头时懒加载（见 start()），
// 这样演示模式/粒子模式在断网环境下也能正常运行，不依赖 CDN。

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---- 模型资源：本地 vendor 路径 + 会话级缓冲 + 带进度下载 ----
const LOCAL_WASM = new URL("../vendor/wasm/", import.meta.url).href;
const LOCAL_MODEL = new URL("../vendor/gesture_recognizer.task", import.meta.url).href;
const modelBuffers = {};   // 已下载的模型缓冲（页面会话内复用，重试秒级完成）
let modelProgressCb = null; // 外部可注册的进度回调

function onModelProgress(cb) { modelProgressCb = cb; }

async function fetchWithProgress(url, onProgress) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const total = Number(res.headers.get("content-length")) || 0;
  if (!res.body) return new Uint8Array(await res.arrayBuffer());
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (onProgress && total) onProgress(Math.min(99, Math.round((got / total) * 100)));
  }
  const all = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { all.set(c, off); off += c.length; }
  if (onProgress) onProgress(100);
  return all;
}

/** 页面一打开就调用：提前下载模型与 wasm（和摄像头授权并行，不再串行等待） */
export async function preloadModel() {
  const p = fetchWithProgress(LOCAL_MODEL, (pct) => { if (modelProgressCb) modelProgressCb(pct); })
    .then((buf) => { modelBuffers[LOCAL_MODEL] = buf; })
    .catch(() => {});
  // 预热 wasm（填 HTTP 缓存，FilesetResolver 再取时秒回）
  fetch(LOCAL_WASM + "vision_wasm_internal.js").catch(() => {});
  fetch(LOCAL_WASM + "vision_wasm_internal.wasm").catch(() => {});
  await p;
}

// 把 navigator.mediaDevices 的报错翻译成给新手的友好提示
function cameraErrorMessage(err) {
  const name = err && err.name ? err.name : "";
  if (name === "NotAllowedError" || name === "SecurityError") {
    return {
      title: "摄像头权限被拒绝了",
      tips: [
        "点击浏览器地址栏左侧的锁形/摄像头图标，把摄像头权限改为「允许」",
        "如果找不到入口，在地址栏输入 chrome://settings/content/camera 检查权限",
        "修改权限后点击下方「重试摄像头」即可，无需重启页面",
      ],
    };
  }
  if (name === "NotFoundError" || name === "OverconstrainedError") {
    return {
      title: "没有检测到摄像头",
      tips: [
        "检查摄像头是否插好、是否被物理开关关闭",
        "确认没有其他应用（如 Zoom、OBS）占用着摄像头",
        "接入摄像头后点击「重试摄像头」",
      ],
    };
  }
  if (name === "NotReadableError" || name === "TrackStartError") {
    return {
      title: "摄像头被其他程序占用了",
      tips: [
        "关闭正在使用摄像头的程序（视频会议、直播、录制软件等）",
        "关闭后点击「重试摄像头」",
      ],
    };
  }
  return {
    title: "摄像头启动失败",
    tips: ["浏览器版本过旧？请更新到最新版 Chrome/Edge", "也可以先点「演示模式」体验完整功能"],
  };
}

class GestureEngine {
  /** @param {HTMLVideoElement} video @param {{onFrame:Function,onGesture:Function,onStatus:Function,onError:Function}} cb */
  constructor(video, cb) {
    this.video = video;
    this.cb = cb;
    this.recognizer = null;
    this.smooth = null;      // 平滑后的 21 个关键点
    this.gesture = "None";   // 已生效手势（防抖后）
    this.confidence = 0;
    this._stable = 0;        // 防抖计数
    this.handSize = 0;       // 手掌大小（归一化）
    this.latencyMs = 0;      // 单帧识别耗时
    this._lastPinchAt = 0;
    this._raf = 0;
    this._destroyed = false;
    this.started = false;
  }

  async start() {
    if (this.started) return true;
    // ---- 1. 打开摄像头 ----
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false,
      });
    } catch (err) {
      this.cb.onError(cameraErrorMessage(err));
      return false;
    }
    this.video.srcObject = stream;
    await this.video.play().catch(() => {});
    this.cb.onStatus("摄像头已开启，正在加载识别模型…", "loading");

    // ---- 2. 加载 MediaPipe 模型（懒加载 CDN 库，网络抖动自动重试；GPU 失败降级 CPU）----
    const loadLib = async () => {
      // 本地 vendor 优先（彻底离线），jsdelivr 兑底
      const sources = [new URL("../vendor/vision_bundle.mjs", import.meta.url).href, "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"];
      let lib = null, lastErr = null;
      for (const src of sources) {
        try { lib = await import(src); break; }
        catch (e) { lib = null; lastErr = e; await new Promise((r) => setTimeout(r, 1200)); }
      }
      if (!lib) throw (lastErr || new Error("vision_bundle 加载失败"));
      return lib;
    };
    // ---- 2. 加载 MediaPipe 模型：页面打开时已预载（带进度），此处直接用缓冲；
    //      本地 vendor 优先（离线可用）→ Google CDN 兑底；GPU 失败降级 CPU ----
    const sources = [
      { wasm: LOCAL_WASM, model: LOCAL_MODEL },
      { wasm: CONFIG.wasmCDN, model: CONFIG.modelURL },
    ];
    let loaded = false;
    for (const src of sources) {
      for (const delegate of ["GPU", "CPU"]) {
        try {
          const lib = await loadLib();
          const vision = await lib.FilesetResolver.forVisionTasks(src.wasm);
          let buf = modelBuffers[src.model];
          if (!buf) {
            buf = await fetchWithProgress(src.model, (p) => {
              this.cb.onStatus(`正在加载识别模型… ${p}%`, "loading");
            });
            modelBuffers[src.model] = buf;
          }
          this.recognizer = await this._create(lib, vision, buf, delegate);
          loaded = true;
          break;
        } catch (e) {
          this.recognizer = null;
          await new Promise((r) => setTimeout(r, 400));
        }
      }
      if (loaded) break;
    }
    if (!loaded) {
      this.cb.onError({
        title: "手势识别模型加载失败",
        tips: [
          "本地模型与 CDN 均未成功，请检查网络后点击「重试摄像头」",
          "也可以先点「演示模式」体验完整功能",
        ],
      });
      return false;
    }
    this.cb.onStatus("已就绪 · 伸出手掌试试", "ok");
    this.started = true;
    this._loop();
    return true;
  }

  _create(lib, vision, modelBuf, delegate) {
    return lib.GestureRecognizer.createFromOptions(vision, {
      baseOptions: { modelAssetBuffer: modelBuf, delegate },
      runningMode: "VIDEO",
      numHands: 1,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
  }

  _loop() {
    if (this._destroyed) return;
    const v = this.video;
    if (this.recognizer && v.readyState >= 2 && v.currentTime > 0) {
      const t0 = performance.now();
      let res = null;
      try {
        res = this.recognizer.recognizeForVideo(v, v.currentTime * 1000);
      } catch (e) { /* 单帧失败忽略，下一帧继续 */ }
      this.latencyMs = performance.now() - t0;
      if (res) this._handle(res);
    }
    this._raf = requestAnimationFrame(() => this._loop());
  }

  _handle(res) {
    const lm = res.landmarks && res.landmarks[0];
    const g = res.gestures && res.gestures[0] && res.gestures[0][0];
    let gesture = g ? g.categoryName : "None";
    let conf = g ? g.score : 0;

    // 置信度低于阈值 => 视为无手势
    if (conf < CONFIG.gestureThreshold) gesture = "None";

    // ---- 关键点平滑：指数平滑，消除手抖 ----
    if (lm) {
      if (!this.smooth) this.smooth = lm.map((p) => ({ x: p.x, y: p.y }));
      for (let i = 0; i < lm.length; i++) {
        this.smooth[i].x += (lm[i].x - this.smooth[i].x) * CONFIG.smoothing;
        this.smooth[i].y += (lm[i].y - this.smooth[i].y) * CONFIG.smoothing;
      }
    } else {
      this.smooth = null;
    }

    // 手掌大小 = 手腕(0)到中指根(9)的距离（归一化）
    this.handSize = this.smooth ? dist(this.smooth[0], this.smooth[9]) : 0;

    // ---- 自定义手势：捏合（拇指尖 4 与食指尖 8 距离）----
    let pinch = false;
    if (this.smooth && this.handSize > 0.001) {
      const d = dist(this.smooth[4], this.smooth[8]);
      pinch = d / this.handSize < CONFIG.pinchRatio;
    }
    if (pinch) gesture = "Thumb_Index";

    // ---- 防抖：连续 N 帧同一手势才生效 ----
    if (gesture !== this.gesture) {
      this._stable++;
      if (this._stable >= CONFIG.stableFrames) {
        this.gesture = gesture;
        this.confidence = conf;
        this._stable = 0;
        if (gesture === "Thumb_Index") {
          const now = performance.now();
          if (now - this._lastPinchAt < CONFIG.pinchCooldownMs) {
            this.gesture = "None"; // 冷却期内不重复触发撤销
          } else {
            this._lastPinchAt = now;
            this.cb.onGesture("Thumb_Index", conf);
          }
        } else if (gesture !== "None") {
          this.cb.onGesture(gesture, conf);
        }
      }
    } else {
      this._stable = 0;
    }

    this.cb.onFrame({
      landmarks: this.smooth ? this.smooth.map((p) => ({ x: p.x, y: p.y })) : null,
      gesture: this.gesture,
      confidence: this.confidence,
      size: this.handSize,
      latencyMs: this.latencyMs,
    });
  }

  stop() {
    this._destroyed = true;
    this.started = false;
    cancelAnimationFrame(this._raf);
    const s = this.video.srcObject;
    if (s) s.getTracks().forEach((t) => t.stop());
    this.video.srcObject = null;
  }
}

let lastHand = null;
let prevPalm = null, prevT = 0;
const vel = { x: 0, y: 0 };

// 笔迹模式图例的图标（与 effects.js 里注册表的 glyph 同一套线条风）
const GLYPHS = {
  Open_Palm: "M5 12 L5 7 M9 12 L9 5 M13 12 L13 5 M17 12 L17 7 M5 12 Q10 16 17 12 L17 10",
  Closed_Fist: "M6 9 Q7 6 12 6 Q17 6 18 9 L18 12 Q18 15 12 15 Q6 15 6 12 Z M7 10 L7 11",
  Pointing_Up: "M10 14 L10 5 M10 5 Q10 3.4 11.4 3.4 Q12.8 3.4 12.8 5 L12.8 14 Q12.8 15.5 11.4 15.5 Q10 15.5 10 14 M8 18 L14 18",
  Victory: "M8 18 L8 8 M8 8 Q8 6.5 9.3 6.5 Q10.6 6.5 10.6 8 L10.6 16 M14 18 L14 6 M14 6 Q14 4.5 15.2 4.5 Q16.4 4.5 16.4 6 L16.4 16",
  Thumb_Up: "M7 12 L7 6 M7 6 Q7 4.5 8.3 4.5 Q9.6 4.5 9.6 6 L9.6 12 M7 12 Q11 11 17 11.5 L17 14 Q17 16.5 13.5 16.5 L10 16.5",
  Thumb_Index: "M6 10 L10 14 M10 14 Q11.5 15.5 12 15.5 M12 4 L15 7 M15 7 Q16.5 8.5 16.5 9 M16.5 9 L20 13",
};

// ---------- 小工具 ----------
function setStatus(text, kind = "idle") {
  const gstat = $("#galaxyStatus");
  if (gstat) gstat.textContent = text; // 银河独立页的角落状态行
  if (!chip) return; // 独立页没有状态灯
  chip.textContent = text;
  chip.dataset.kind = kind;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.add("hidden"), 1800);
}

function showError(err) {
  errorPanel.innerHTML = "";
  const card = document.createElement("div");
  card.className = "error-card";
  const title = document.createElement("h2");
  title.className = "error-title";
  title.textContent = err.title;
  const tips = document.createElement("ul");
  tips.className = "error-tips";
  for (const t of err.tips || []) {
    const li = document.createElement("li");
    li.textContent = t;
    tips.appendChild(li);
  }
  const actions = document.createElement("div");
  actions.className = "error-actions";
  for (const [label, fn] of [
    ["重试摄像头", startCamera],
    ["进入演示模式", startDemo],
  ]) {
    const b = document.createElement("button");
    b.className = "btn";
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", () => finishError(fn));
    actions.appendChild(b);
  }
  card.append(title, tips, actions);
  errorPanel.appendChild(card);
  errorPanel.classList.remove("hidden");
}

function finishError(fn) {
  errorPanel.classList.add("hidden");
  fn();
}

// ---------- 手部上下文（两个渲染模式共用） ----------
function computeHand(f) {
  if (!f.landmarks) return null;
  const tip = pad.toCanvas(f.landmarks[8]);
  const pip = pad.toCanvas(f.landmarks[6]);
  const palmIdx = [0, 5, 9, 13, 17];
  let px = 0, py = 0;
  for (const i of palmIdx) {
    const p = pad.toCanvas(f.landmarks[i]);
    px += p.x; py += p.y;
  }
  const palm = { x: px / palmIdx.length, y: py / palmIdx.length };
  const midTip = pad.toCanvas(f.landmarks[12]);

  // 掌心速度（指数平滑），供"掌风"与粒子喷射初速度使用
  const now = performance.now();
  if (prevPalm && prevT) {
    const dt = Math.max(4, now - prevT) / 1000;
    const ivx = (palm.x - prevPalm.x) / dt;
    const ivy = (palm.y - prevPalm.y) / dt;
    vel.x += (ivx - vel.x) * 0.4;
    vel.y += (ivy - vel.y) * 0.4;
  }
  prevPalm = palm;
  prevT = now;

  const dx = tip.x - pip.x, dy = tip.y - pip.y;
  const dl = Math.hypot(dx, dy) || 1;
  return {
    landmarks: f.landmarks,
    tip, palm,
    mid: { x: (tip.x + midTip.x) / 2, y: (tip.y + midTip.y) / 2 },
    dir: { x: dx / dl, y: dy / dl },
    vel: { x: vel.x, y: vel.y },
    size: f.size,
    color: CONFIG.colors[pad.colorIdx],
  };
}

// ---------- 粒子模式：每帧入口 ----------
function particleFrame(f) {
  const hand = computeHand(f);
  lastHand = hand;

  // 花朵独立页：只保留一种体验——张手花开、握拳消散，其余手势全部忽略
  let g = f.gesture;
  if (window.__FLOWER_ONLY) {
    g = (g === "Open_Palm" || g === "Thumb_Index") ? "Thumb_Index"
      : g === "Closed_Fist" ? "Thumb_Up"
      : "None";
  }

  // 效果注册表分发：进入 / 持续 / 退出
  if (g !== lastGesture) {
    const old = EFFECTS[lastGesture];
    if (old && old.onExit) old.onExit(hand, ps);
    const cur = EFFECTS[g];
    if (cur && cur.onEnter) cur.onEnter(hand, ps);
    lastGesture = g;
  }
  const eff = EFFECTS[g];
  if (eff && eff.onFrame && hand) eff.onFrame(hand, ps);

  // 花朵页氛围：漂浮的微光星尘
  if (window.__FLOWER_ONLY && Math.random() < 0.5 && ps.count < 3000) {
    ps.spawn({
      x: Math.random() * pad.w, y: Math.random() * pad.h,
      vx: (Math.random() - 0.5) * 6, vy: -3 - Math.random() * 6,
      life: 4 + Math.random() * 3, size: 0.7 + Math.random() * 0.8,
      color: "#9fc7ff", gravity: 0, drag: 1,
    });
  }
}

// 粒子模式渲染循环：统一在这里做物理更新与绘制（无手时也保持画面活着）
function particleLoop() {
  if (renderMode !== "particles") return;
  const now = performance.now();
  if (loopT && now - loopT < 14) { _raf = requestAnimationFrame(particleLoop); return; } // ~60fps 上限（高刷屏减负）
  const dt = Math.min(0.05, (now - (loopT || now)) / 1000);
  loopT = now;

  const wind = lastHand
    ? { x: lastHand.palm.x, y: lastHand.palm.y, vx: lastHand.vel.x, vy: lastHand.vel.y, r: CONFIG.particles.handDragRadius, strength: CONFIG.particles.handDragStrength }
    : null;
  ps.update(dt, wind);
  ps.render((ctx) => { if (lastHand && !window.__FLOWER_ONLY) drawHud(ctx, lastHand); });

  hint?.classList.toggle("hidden", !!lastHand);
  if (camStatus && ++frameTick % 30 === 0) {
    camStatus.textContent = mode === "camera" ? `TRACKING · ${ps.count} PARTICLES` : `DEMO · ${ps.count} PARTICLES`;
  }
  _raf = requestAnimationFrame(particleLoop);
}

// 手部追踪 HUD：青色虚线骨架 + 琥珀色尺寸读数
function drawHud(ctx, hand) {
  const lm = hand.landmarks;
  const P = (i) => pad.toCanvas(lm[i]);
  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.strokeStyle = "rgba(45, 216, 255, .5)";
  ctx.lineWidth = 1.2;
  for (const mcp of [5, 9, 13, 17]) {
    const a = P(0), b = P(mcp);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const i of [4, 8, 12, 16, 20]) {
    const p = P(i);
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.setLineDash([]);
  const wrist = P(0), midTip = P(12);
  if (!window.__FLOWER_ONLY) {
    ctx.font = '11px Consolas, "Cascadia Code", monospace';
    ctx.fillStyle = "rgba(255, 180, 84, .9)";
    // 读数标注放在手腕附近，避免压住花心等画面主体
    ctx.fillText(`SIZE:${Math.round(hand.size * 100)}`, wrist.x + 12, wrist.y + 16);
  }
  ctx.restore();
}

// ---------- 3D 星环模式 ----------
let space3d = null;

function spaceFrame(f) {
  lastHand = computeHand(f);
  lastGesture = f.gesture; // 进入/退出判定由 Space3D 内部用 _g 追踪
}

function spaceLoop() {
  if (renderMode !== "space3d" || !space3d) return;
  const now = performance.now();
  if (loopT && now - loopT < 14) { _raf = requestAnimationFrame(spaceLoop); return; } // ~60fps 上限（高刷屏减负）
  const dt = Math.min(0.05, (now - loopT) / 1000);
  loopT = now;
  space3d.update(dt, lastHand, lastGesture);
  space3d.render();
  // HUD 画在 2D 画布上（星环在底层 3D 画布）
  pad.ctx.clearRect(0, 0, pad.w, pad.h);
  if (lastHand) drawHud(pad.ctx, lastHand);
  hint.classList.toggle("hidden", !!lastHand);
  if (++frameTick % 30 === 0) {
    camStatus.textContent = mode === "camera" ? `SATURN RING · ${space3d.count}` : `DEMO · ${space3d.count} STARS`;
  }
  _raf = requestAnimationFrame(spaceLoop);
}

async function enterSpace() {
  $("#space").classList.remove("hidden");
  if (!space3d) {
    setStatus("正在加载 3D 引擎…", "loading");
    try {
      /* Space3D 已内联 */
      space3d = new Space3D($("#space"));
      await space3d.init();
    } catch (e) {
      $("#space").classList.add("hidden");
      setStatus("3D 引擎加载失败", "err");
      showError({
        title: "3D 银河需要 WebGL 支持",
        tips: [
          "你的浏览器无法创建 WebGL 画面（可能被禁用或显卡驱动问题）",
          "Chrome/Edge 设置里搜索「硬件加速」并开启，然后重启浏览器",
          "也可以先点「演示模式」看粒子效果的演示",
        ],
      });
      renderMode = "particles";
      syncModeButtons(); buildLegend();
      if (space3d && space3d.dispose) space3d.dispose();
      space3d = null;
      pad._resize(); ps._resize(); particleLoop();
      applyModeVisuals();
      return;
    }
  }
  space3d._resize();
  if (demo) demo.hold = false; // 引擎就绪，时间轴开走
  spaceLoop();
}

// ---------- 银河星旅模式 ----------
let galaxy = null;
let flower3d = null;
const flowerOpts = { scaleMin: 0.6, scaleMax: 1.6, sensitivity: 1, moveSpeed: 1, forceScan: false };

function galaxyFrame(f) {
  lastHand = computeHand(f);
  lastGesture = f.gesture;
}

function galaxyLoop() {
  if (renderMode !== "galaxy" || !galaxy) return;
  const now = performance.now();
  if (loopT && now - loopT < 14) { _raf = requestAnimationFrame(galaxyLoop); return; } // ~60fps 上限（高刷屏减负）
  const dt = Math.min(0.05, (now - (loopT || now)) / 1000);
  loopT = now;
  galaxy.update(dt, lastHand, lastGesture);
  galaxy.render();
  // HUD：独立页只有行星英文标签；完整版另加手部骨架图案
  pad.ctx.clearRect(0, 0, pad.w, pad.h);
  const singleUI = document.body.classList.contains("single");
  if (!singleUI && lastHand) drawHud(pad.ctx, lastHand);
  if (galaxy.labels && galaxy.vw) {
    const lc = pad.ctx;
    lc.font = '12px Consolas, "Cascadia Code", monospace';
    lc.lineWidth = 1.4;
    for (const l of galaxy.labels) {
      if (!l.visible) continue;
      const sel = l.selected;
      const c = sel ? "rgba(255, 180, 84, .95)" : "rgba(45, 216, 255, .75)";
      lc.strokeStyle = c; lc.fillStyle = c;
      lc.beginPath();
      lc.moveTo(l.x, l.y - 5); lc.lineTo(l.x + 5, l.y); lc.lineTo(l.x, l.y + 5); lc.lineTo(l.x - 5, l.y);
      lc.closePath(); lc.stroke();
      // 英文名常显；选中的行星变琥珀色并加 ▶
      lc.fillText(sel ? `${l.en} ▶` : l.en, l.x + 10, l.y + 4);
      if (sel && !singleUI && galaxy.state === "arrived") lc.fillText(l.blurb, l.x + 10, l.y + 22);
    }
  }
  hint?.classList.toggle("hidden", !!lastHand);
  if (camStatus && ++frameTick % 30 === 0) {
    const arrived = galaxy.state === "arrived" && galaxy._arrivedPlanet;
    camStatus.textContent = arrived ? `ARRIVED · ${galaxy._arrivedPlanet.en}` : `MILKY WAY · ${galaxy.count} STARS`;
  }
  _raf = requestAnimationFrame(galaxyLoop);
}

          "Chrome/Edge 设置里搜索「硬件加速」并开启，然后重启浏览器",

// ---------- 3D 点云花朵（flower 独立页）----------
function flower3dLoop() {
  if (renderMode !== "flower3d" || !flower3d) return;
  const now = performance.now();
  if (loopT && now - loopT < 14) { _raf = requestAnimationFrame(flower3dLoop); return; } // ~60fps 上限
  const dt = Math.min(0.05, (now - loopT) / 1000);
  loopT = now;
  flower3d.update(dt, lastHand, lastGesture);
  flower3d.render();
  const stEl = $("#flowerStatus");
  if (stEl && stEl.textContent !== flower3d.stateText) stEl.textContent = flower3d.stateText;
  hint?.classList.toggle("hidden", !!lastHand);
  _raf = requestAnimationFrame(flower3dLoop);
}

async function enterFlower3d() {
  $("#space").classList.remove("hidden");

      });
      renderMode = "particles";

      pad._resize(); ps._resize(); particleLoop();
      applyModeVisuals();

    }

  flower3d._resize();

// ---------- 笔迹模式：每帧入口（原有逻辑） ----------
function inkFrame(f) {
  pad.hand = f.landmarks ? { landmarks: f.landmarks, size: f.size, present: true } : { present: false };

  // 张开手掌 = 绘制；食指尖(8)就是笔尖
  if (f.gesture === "Open_Palm" && f.landmarks) {
    pad.begin();
    const pt = pad.toCanvas(f.landmarks[8]);
    pad.addPoint(pt.x, pt.y, f.size);
    pad.cursor = pt;
    pad.dirty = true;
  } else {
    pad.end();
    pad.cursor = null;
  }

  // 手在场时构造线/光标要跟着动，强制每帧重绘
  if (f.landmarks) pad.dirty = true;
  hint?.classList.toggle("hidden", !!f.landmarks);
  if (pad.dirty) pad.render();
}

// ---------- 背景与模式视觉 ----------
function syncCamBg() {
  const bg = $("#camBg");
  const on = (renderMode === "particles" || renderMode === "flower3d") && mode === "camera" && video.srcObject;
  bg.classList.toggle("hidden", !on);
  if (on) bg.srcObject = video.srcObject; // 摄像头画面作粒子/花朵背景（仅本地）
}

function applyModeVisuals() {
  const space = renderMode === "space3d" || renderMode === "galaxy";
  document.body.classList.toggle("space-mode", space); // 银河/星环：纯黑沉浸背景
  document.querySelector(".paper-wrap").classList.toggle("space-bg", space);
  syncCamBg();
}

// ---------- 统一帧入口 ----------
function onFrame(f) {
  if (renderMode === "particles") particleFrame(f);
  else if (renderMode === "space3d") spaceFrame(f);
  else if (renderMode === "galaxy") galaxyFrame(f);
  else inkFrame(f);
}

// ---------- 一次性手势事件（笔迹模式的动作在这里；粒子模式走注册表） ----------
function onGesture(g) {
  if (renderMode !== "ink") return; // 粒子/星环/银河各自在帧循环里分发，不能提前改 lastGesture
  lastGesture = g;

  switch (g) {
    case "Closed_Fist":
      pad.cycleColor();
      showToast(`颜色 → ${CONFIG.colors[pad.colorIdx]}`);
      syncSwatches();
      break;
    case "Pointing_Up": {
      const on = pad.toggleConstruction();
      constrToggle.checked = on;
      showToast(`构造线${on ? "已打开" : "已关闭"}`);
      break;
    }
    case "Victory":
      showToast(`笔刷：${pad.cycleWidth()}`);
      break;
    case "Thumb_Up":
      pad.clear();
      showToast("已清空画布");
      break;
    case "Thumb_Index":
      if (pad.strokes.length) showToast("撤销上一笔");
      else showToast("画布是空的");
      pad.undo();
      break;
  }
}

// ---------- 模式切换 ----------
function setRenderMode(m) {
  if (renderMode === m) return;
  renderMode = m;
  cancelAnimationFrame(_raf);
  ps.killAll(0);
  ps.attractors.length = 0;
  ps.vortices.length = 0;
  lastGesture = "None";
  prevPalm = null;
  if (demo && m !== "space3d" && m !== "galaxy") demo.hold = false; // 离开 3D 模式时解除时间轴暂停
  const checkWrap = constrToggle ? constrToggle.closest(".check") : null;
  if (checkWrap) checkWrap.classList.toggle("hidden", m !== "ink");
  $("#space").classList.toggle("hidden", !(m === "space3d" || m === "flower3d"));
  $("#galaxy").classList.toggle("hidden", m !== "galaxy");
  buildLegend();
  syncModeButtons();
  if (m === "particles") { pad._resize(); ps._resize(); particleLoop(); showToast("粒子模式"); }
  else if (m === "ink") { pad._resize(); pad.dirty = true; showToast("笔迹模式"); }
  else if (m === "space3d") { enterSpace().then(() => showToast("3D 星环模式")); }
  else if (m === "galaxy") { enterGalaxy().then(() => showToast("银河星旅模式")); }
  else if (m === "flower3d") { enterFlower3d(); }
  applyModeVisuals();
}

function syncModeButtons() {
  $("#btnModeGalaxy")?.classList.toggle("ghost", renderMode !== "galaxy");
  $("#btnModeSpace")?.classList.toggle("ghost", renderMode !== "space3d");
  $("#btnModeParticles")?.classList.toggle("ghost", renderMode !== "particles");
  $("#btnModeInk")?.classList.toggle("ghost", renderMode !== "ink");
}

// ---------- 摄像头 / 演示 ----------
async function startCamera() {
  stopDemo();
  mode = "camera";
  demoBadge.classList.add("hidden");
  setStatus("正在打开摄像头…", "loading");
  camStatus && (camStatus.textContent = "请求权限中…");
  const ok = await engineStart();
  if (!ok) mode = "paper";
  applyModeVisuals();
}

async function engineStart() {
  if (!engine) {
    engine = new GestureEngine(video, {
      onFrame,
      onGesture,
      onStatus: setStatus,
      onError: showError,
    });
  }
  return engine.start();
}

function startDemo() {
  stopEngine();
  mode = "demo";
  demoBadge.classList.remove("hidden");
  setStatus("演示模式运行中", "demo");
  applyModeVisuals();
  Promise.resolve({ DemoHand }).then(({ DemoHand }) => {
    demo = new DemoHand({ onFrame, onGesture });
    // 3D 模式下等引擎就绪再开始走时间轴（其他模式渲染即就绪）
    demo.hold = renderMode === "space3d" || renderMode === "galaxy" || renderMode === "flower3d";
    demo.start();
  }).catch(() => setStatus("演示加载失败", "err"));
}

function stopDemo() {
  if (demo) { demo.stop(); demo = null; }
}
function stopEngine() {
  if (engine) { engine.stop(); engine = null; }
}

// ---------- UI ----------
function syncSwatches() {
  if (!swatchesEl) return; // 独立页面可能没有色板
  [...swatchesEl.children].forEach((el, i) =>
    el.classList.toggle("active", i === pad.colorIdx)
  );
}

function buildSwatches() {
  CONFIG.colors.forEach((c, i) => {
    const sw = document.createElement("button");
    sw.type = "button";
    sw.className = "swatch";
    sw.style.background = c;
    sw.title = `颜色 ${i + 1}`;
    sw.addEventListener("click", () => { pad.setColor(i); syncSwatches(); });
    swatchesEl.appendChild(sw);
  });
  syncSwatches();
}

function buildLegend() {
  if (!legendEl) return; // 独立页面没有图例栏
  legendEl.innerHTML = "";
  let items;
  if (renderMode === "galaxy") {
    items = [
      { glyph: GLYPHS.Open_Palm, text: "张开手掌 · 光标悬停选择行星" },
      { glyph: GLYPHS.Thumb_Index, text: "捏合 · 跃迁到选中的行星" },
      { glyph: GLYPHS.Thumb_Index, text: "到达后再捏合 · 返回银河全景" },
      { glyph: GLYPHS.Thumb_Up, text: "点赞 · 直接返回全景" },
      { glyph: GLYPHS.Closed_Fist, text: "握拳 · 银河旋转加速" },
      { glyph: GLYPHS.Victory, text: "剪刀手 · 时间迟缓" },
      { glyph: GLYPHS.Pointing_Up, text: "食指上指 · 俯瞰银河旋臂" },
    ];
  } else if (renderMode === "space3d") {
    items = [
      { glyph: GLYPHS.Open_Palm, text: "张开手掌 · 视角跟随，挥动加速旋转" },
      { glyph: GLYPHS.Closed_Fist, text: "握拳 · 星环收缩加速" },
      { glyph: GLYPHS.Pointing_Up, text: "食指上指 · 俯瞰视角" },
      { glyph: GLYPHS.Victory, text: "剪刀手 · 星环分裂双环" },
      { glyph: GLYPHS.Thumb_Up, text: "点赞 · 超新星重组" },
      { glyph: GLYPHS.Thumb_Index, text: "捏合 · 聚合成星球" },
    ];
  } else if (renderMode === "particles") {
    items = Object.entries(EFFECTS).map(([g, e]) => ({ glyph: e.glyph, text: `${e.label} · ${e.hint}` }));
  } else {
    items = Object.entries(GESTURE_INFO)
      .filter(([g]) => g !== "None" && GLYPHS[g])
      .map(([g, info]) => ({ glyph: GLYPHS[g], text: `${info.label} · ${info.hint}` }));
  }
  for (const it of items) {
    const li = document.createElement("li");
    li.innerHTML = `<svg viewBox="0 0 24 24" class="glyph"><path d="${it.glyph}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>${it.text}</span>`;
    legendEl.appendChild(li);
  }
}

const btnUndoEl = $("#btnUndo");
if (btnUndoEl) btnUndoEl.addEventListener("click", () => { pad.undo(); showToast("撤销上一笔"); });
const btnClearEl = $("#btnClear");
if (btnClearEl) btnClearEl.addEventListener("click", () => { pad.clear(); ps.killAll(0); showToast("已清空"); });
const btnSaveEl = $("#btnSave");
if (btnSaveEl) btnSaveEl.addEventListener("click", () => pad.exportPNG());
const btnDemoEl = $("#btnDemo");
if (btnDemoEl) btnDemoEl.addEventListener("click", startDemo);
const btnCamEl = $("#btnCam");
if (btnCamEl) btnCamEl.addEventListener("click", startCamera);

// 花朵页 3D 点云扫描仪控件（仅独立页存在）
const optBind = (sel, key) => {
  const el = $(sel);
  if (el) el.addEventListener("input", () => { flowerOpts[key] = parseFloat(el.value); });
};
optBind("#optMinS", "scaleMin");
optBind("#optMaxS", "scaleMax");
optBind("#optSens", "sensitivity");
optBind("#optMspd", "moveSpeed");
const btnScanEl = $("#btnScan");
if (btnScanEl) btnScanEl.addEventListener("click", () => {
  flowerOpts.forceScan = !flowerOpts.forceScan;
  btnScanEl.classList.toggle("active", flowerOpts.forceScan);
});
const plyEl = $("#plyFile");
if (plyEl) plyEl.addEventListener("change", () => {
  const f = plyEl.files && plyEl.files[0];
  if (!f || !flower3d) return;
  const reader = new FileReader();
  reader.onload = () => {
    const okLoad = flower3d.loadPointCloud(String(reader.result || ""));
    showToast(okLoad ? "点云已加载" : "点云解析失败（支持 XYZ / PLY ascii）");
  };
  reader.readAsText(f);
});
const btnModeGalaxyEl = $("#btnModeGalaxy");
if (btnModeGalaxyEl) btnModeGalaxyEl.addEventListener("click", () => setRenderMode("galaxy"));
const btnModeSpaceEl = $("#btnModeSpace");
if (btnModeSpaceEl) btnModeSpaceEl.addEventListener("click", () => setRenderMode("space3d"));
const btnModeParticlesEl = $("#btnModeParticles");
if (btnModeParticlesEl) btnModeParticlesEl.addEventListener("click", () => setRenderMode("particles"));
const btnModeInkEl = $("#btnModeInk");
if (btnModeInkEl) btnModeInkEl.addEventListener("click", () => setRenderMode("ink"));
if (constrToggle) constrToggle.addEventListener("change", () => {
  pad.construction = constrToggle.checked;
  pad.dirty = true;
});

document.addEventListener("visibilitychange", () => {
  if (demo) demo.hold = document.hidden; // 后台时暂停演示时间轴（rAF 循环本就自动暂停）
});

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); pad.undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); pad.exportPNG(); }
  if (e.key >= "1" && e.key <= "9") {
    const i = Number(e.key) - 1;
    if (i < CONFIG.colors.length) { pad.setColor(i); syncSwatches(); }
  }
  if (e.key.toLowerCase() === "c" && renderMode === "ink" && constrToggle) {
    const on = pad.toggleConstruction();
    constrToggle.checked = on;
  }
});

// ---------- 暴露给自动化测试的钩子 ----------
window.__app = {
  get renderMode() { return renderMode; },
  get mode() { return mode; },
  get lastGesture() { return lastGesture; },
  get space() { return space3d; },
  get galaxy() { return galaxy; },
  get flower3d() { return flower3d; },
  strokes: () => pad.strokes.length,
  particles: () => (renderMode === "space3d" && space3d ? space3d.count : renderMode === "galaxy" && galaxy ? galaxy.count : renderMode === "flower3d" && flower3d ? flower3d.count : ps.count),
  engineStarted: () => !!(engine && engine.started),
  demoT: () => (demo ? demo.t : -1),
  latency: () => (engine ? engine.latencyMs : 0),
  pad,
  ps,
  setRenderMode,
  startCamera,
  startDemo,
};

// ---------- 启动 ----------
if (swatchesEl) buildSwatches();
buildLegend();
syncModeButtons();
const checkWrap0 = constrToggle ? constrToggle.closest(".check") : null;
if (checkWrap0) checkWrap0.classList.toggle("hidden", renderMode !== "ink"); // 只有笔迹模式显示构造线开关
if (renderMode === "particles") {
  particleLoop();
} else if (renderMode === "space3d") {
  enterSpace();
} else if (renderMode === "galaxy") {
  enterGalaxy();
} else if (renderMode === "flower3d") {
  enterFlower3d();
}
applyModeVisuals();

onModelProgress((p) => { if (mode === "camera") setStatus(`正在加载识别模型… ${p}%`, "loading"); });
preloadModel().catch(() => {}); // 页面一打开就开始下载模型（与摄像头授权并行）

const params = new URLSearchParams(location.search);
if (params.get("demo") === "1") {
  startDemo();
} else if (params.get("paper") === "1") {
  setStatus("画布预览模式（未开启摄像头）", "idle");
  camStatus.textContent = "未开启";
} else {
  startCamera();
}

</script>
</body>
</html>
