<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花开绽放 · Flower Bloom</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='2.2' fill='none' stroke='%23ffb454' stroke-width='1.4'/><path d='M12 9.8 C10 7 10 4.5 12 3 C14 4.5 14 7 12 9.8 M14.2 11 C17.5 9.6 19.8 10.4 20.6 12.8 C18.2 14.2 15.6 13.4 14.2 11 M9.8 11 C6.5 9.6 4.2 10.4 3.4 12.8 C5.8 14.2 8.4 13.4 9.8 11' fill='none' stroke='%232dd8ff' stroke-width='1.3' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="single single-flower space-mode">
  <header class="topbar">
    <h1 class="logo"><b>FLOWER</b> BLOOM <span class="logo-sub">花开绽放</span></h1>
    <div id="statusChip" class="chip" data-kind="idle">组件加载中…</div>
  </header>

  <main class="stage">
    <section class="paper-wrap">
      <video id="camBg" class="hidden" autoplay playsinline muted></video>
      <canvas id="space" class="hidden"></canvas>
      <canvas id="galaxy" class="hidden"></canvas>
      <canvas id="paper" width="900" height="560"></canvas>
      <div id="hint" class="hint">AWAITING HAND INPUT<br><span class="cn">张开手掌 · 花朵在指尖绽放<br>握拳 · 消散</span></div>
      <div id="demoBadge" class="demo-badge hidden">演示模式 · 虚拟手</div>
      <div id="toast" class="toast hidden"></div>
    </section>

    <div class="float-ctl">
      <button id="btnDemo" class="btn" type="button">演示模式</button>
      <button id="btnCam" class="btn" type="button">开启摄像头</button>
    </div>
  </main>

  <footer class="foot">
    摄像头画面仅在本机浏览器内分析，不会上传 ·
    <a href="../galaxy/">银河星旅</a> · <a href="../index.html">完整版</a>
  </footer>

  <div id="errorPanel" class="error-panel hidden"></div>

  <script>
    window.__FORCE_MODE = "particles";
    window.__FLOWER_ONLY = true;
  </script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
