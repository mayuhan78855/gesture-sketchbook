<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花开绽放 · 3D 点云花朵扫描仪</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='2.2' fill='none' stroke='%23ffb454' stroke-width='1.4'/><path d='M12 9.8 C10 7 10 4.5 12 3 C14 4.5 14 7 12 9.8 M14.2 11 C17.5 9.6 19.8 10.4 20.6 12.8 C18.2 14.2 15.6 13.4 14.2 11 M9.8 11 C6.5 9.6 4.2 10.4 3.4 12.8 C5.8 14.2 8.4 13.4 9.8 11' fill='none' stroke='%232dd8ff' stroke-width='1.3' stroke-linecap='round'/></svg>">
  <!-- STYLESHEET -->
</head>
<body class="single single-flower space-mode">
  <main class="stage">
    <section class="paper-wrap">
      <video id="camBg" class="hidden" autoplay playsinline muted></video>
      <div id="darkOverlay"></div>
      <canvas id="space"></canvas>
      <canvas id="galaxy" class="hidden"></canvas>
      <canvas id="paper" class="hidden" width="900" height="560"></canvas>

      <div id="flowerStatus" class="hud-status">AWAITING GESTURE — Open Right Hand to Summon</div>

      <div class="hud-panel hud-left">
        <div class="hud-title">// POINT CLOUD PARAMS</div>
        <label class="hud-row">Min Scale<input id="optMinS" type="range" min="0.4" max="1.2" step="0.05" value="0.6"></label>
        <label class="hud-row">Max Scale<input id="optMaxS" type="range" min="1.0" max="2.2" step="0.05" value="1.6"></label>
        <label class="hud-row">Sensitivity<input id="optSens" type="range" min="0.4" max="2" step="0.1" value="1"></label>
        <label class="hud-row">Move Speed<input id="optMspd" type="range" min="0" max="2" step="0.1" value="1"></label>
        <div class="hud-btns">
          <button id="btnScan" class="hud-btn" type="button">Linear Scan</button>
          <label class="hud-btn" for="plyFile">Upload PLY/XYZ</label>
          <input id="plyFile" type="file" accept=".ply,.xyz,.txt" hidden>
        </div>
      </div>

      <div class="hud-panel hud-right">
        <div class="hud-title">// GESTURE COMMANDS</div>
        <div class="hud-row">Summon<span>Open Palm (Right Hand)</span></div>
        <div class="hud-row">Rotate<span>Twist Right Wrist</span></div>
        <div class="hud-row">Scale<span>Hand Distance</span></div>
        <div class="hud-row">Scan<span>Thumb &amp; Index [Hovering]</span></div>
        <div class="hud-row">Reset<span>Closed Fist (Right Hand)</span></div>
      </div>

      <div id="demoBadge" class="demo-badge hidden">DEMO · 虚拟手</div>
      <div id="toast" class="toast hidden"></div>
    </section>
  </main>

  <footer class="foot">
    摄像头画面仅在本机浏览器内分析，不会上传 ·
    <a href="../galaxy/">银河星旅</a> · <a href="../index.html">完整版</a>
  </footer>

  <div id="errorPanel" class="error-panel hidden"></div>

  <video id="cam" class="media-src" autoplay playsinline muted></video>
  <div id="camStatus" class="media-src"></div>

  <script>
    window.__FORCE_MODE = "flower3d";
  </script>
  <!-- APPJS -->
</body>
</html>
